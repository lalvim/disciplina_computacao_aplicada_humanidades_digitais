<title id="titulo">Comparação entre TTR bruta e padronizada</title>
<desc id="descricao">Dois painéis relacionam tamanho e diversidade. O primeiro usa a TTR bruta; o segundo usa os primeiros 19 tokens de cada documento para controlar o tamanho.</desc>
