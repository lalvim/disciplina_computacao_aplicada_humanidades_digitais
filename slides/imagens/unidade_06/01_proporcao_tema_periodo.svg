<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590" role="img">
<title>Proporção de documentos com tema educação por período</title>
<desc>Duas barras de cem por cento com 32,5 por cento no primeiro período e 62,5 no segundo.</desc>
<rect width="1100" height="590" fill="#fffdf7"/>
<style>text{font-family:Aptos,Arial,sans-serif}.title{font-size:28px;font-weight:700;fill:#17324d}.label{font-size:20px;fill:#202a33}.small{font-size:16px;fill:#4b5563}.value{font-size:19px;font-weight:700;fill:#17324d}</style>
<text x="550" y="48" text-anchor="middle" class="title">Cada barra representa 40 documentos</text>
<text x="220" y="172" text-anchor="end" class="label">1890–1899</text>
<rect x="245" y="135" width="700" height="62" rx="6" fill="#e7e0d4"/>
<rect x="245" y="135" width="227.5" height="62" rx="6" fill="#176b68"/>
<text x="358.8" y="174" text-anchor="middle" fill="white" font-size="20" font-weight="700">sim: 32.5%</text>
<text x="708.8" y="174" text-anchor="middle" class="value">não: 67.5%</text>
<text x="245" y="226" class="small">n = 40 documentos</text>
<text x="220" y="337" text-anchor="end" class="label">1900–1909</text>
<rect x="245" y="300" width="700" height="62" rx="6" fill="#e7e0d4"/>
<rect x="245" y="300" width="437.5" height="62" rx="6" fill="#176b68"/>
<text x="463.8" y="339" text-anchor="middle" fill="white" font-size="20" font-weight="700">sim: 62.5%</text>
<text x="813.8" y="339" text-anchor="middle" class="value">não: 37.5%</text>
<text x="245" y="391" class="small">n = 40 documentos</text>
<rect x="245" y="485" width="22" height="22" fill="#176b68"/><text x="279" y="503" class="small">tema educação = sim</text>
<rect x="510" y="485" width="22" height="22" fill="#e7e0d4"/><text x="544" y="503" class="small">tema educação = não</text>
<text x="550" y="550" text-anchor="middle" class="small">Fonte: registros_associacao.csv · dados inteiramente fictícios</text>
</svg>
