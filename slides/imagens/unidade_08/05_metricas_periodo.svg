<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590" role="img">
<title>Desempenho da árvore por período</title>
<desc>Barras mostram forte diferença de revocação entre os dois períodos no teste.</desc>
<rect width="1100" height="590" fill="#fffdf7"/>
<style>text{font-family:Aptos,Arial,sans-serif}.title{font-size:28px;font-weight:700;fill:#17324d}.label{font-size:19px;fill:#202a33}.small{font-size:16px;fill:#4b5563}.value{font-size:20px;font-weight:700;fill:#17324d}</style>
<text x="550" y="42" text-anchor="middle" class="title">A média geral oculta onde os erros se concentram</text>
<text x="310" y="105" text-anchor="middle" class="value">1890–1899 · n=20</text>
<rect x="180" y="311.0" width="68" height="144.0" fill="#17324d" rx="4"/>
<text x="214" y="301.0" text-anchor="middle" class="small">0.45</text>
<text x="214" y="482" text-anchor="middle" class="small">Acu.</text>
<rect x="275" y="423.0" width="68" height="32.0" fill="#a84f2a" rx="4"/>
<text x="309" y="413.0" text-anchor="middle" class="small">0.10</text>
<text x="309" y="482" text-anchor="middle" class="small">Rev.</text>
<rect x="370" y="405.8" width="68" height="49.2" fill="#176b68" rx="4"/>
<text x="404" y="395.8" text-anchor="middle" class="small">0.15</text>
<text x="404" y="482" text-anchor="middle" class="small">F1.</text>
<text x="750" y="105" text-anchor="middle" class="value">1900–1909 · n=20</text>
<rect x="620" y="295.0" width="68" height="160.0" fill="#17324d" rx="4"/>
<text x="654" y="285.0" text-anchor="middle" class="small">0.50</text>
<text x="654" y="482" text-anchor="middle" class="small">Acu.</text>
<rect x="715" y="167.0" width="68" height="288.0" fill="#a84f2a" rx="4"/>
<text x="749" y="157.0" text-anchor="middle" class="small">0.90</text>
<text x="749" y="482" text-anchor="middle" class="small">Rev.</text>
<rect x="810" y="249.3" width="68" height="205.7" fill="#176b68" rx="4"/>
<text x="844" y="239.3" text-anchor="middle" class="small">0.64</text>
<text x="844" y="482" text-anchor="middle" class="small">F1.</text>
<text x="550" y="548" text-anchor="middle" class="small">Auditoria descritiva: grupos de vinte casos produzem estimativas instáveis</text>
</svg>
