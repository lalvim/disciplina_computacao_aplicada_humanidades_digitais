<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590" role="img">
<title>Menções reconhecidas por tipo</title>
<desc>Barras mostram 11 pessoas, 16 organizações e 8 lugares encontrados pelo dicionário nos doze documentos.</desc>
<rect width="1100" height="590" fill="#fffdf7"/>
<style>text{font-family:Aptos,Arial,sans-serif}.title{font-size:28px;font-weight:700;fill:#17324d}.label{font-size:19px;fill:#202a33}.small{font-size:16px;fill:#4b5563}.value{font-size:22px;font-weight:700;fill:#17324d}.mono{font-family:monospace;font-size:18px;fill:#17324d}</style>
<text x="550" y="42" text-anchor="middle" class="title">O dicionário encontra 35 menções — inclusive um caso errado</text>
<line x1="175.0" y1="100" x2="175.0" y2="460" stroke="#d8cdbb"/>
<text x="175.0" y="490" text-anchor="middle" class="small">0</text>
<line x1="365.0" y1="100" x2="365.0" y2="460" stroke="#d8cdbb"/>
<text x="365.0" y="490" text-anchor="middle" class="small">4</text>
<line x1="555.0" y1="100" x2="555.0" y2="460" stroke="#d8cdbb"/>
<text x="555.0" y="490" text-anchor="middle" class="small">8</text>
<line x1="745.0" y1="100" x2="745.0" y2="460" stroke="#d8cdbb"/>
<text x="745.0" y="490" text-anchor="middle" class="small">12</text>
<line x1="935.0" y1="100" x2="935.0" y2="460" stroke="#d8cdbb"/>
<text x="935.0" y="490" text-anchor="middle" class="small">16</text>
<text x="150" y="167" text-anchor="end" class="label">Pessoas</text>
<rect x="175" y="125" width="522.5" height="62" rx="8" fill="#176b68"/>
<text x="679.5" y="166" text-anchor="end" font-size="25" font-weight="700" fill="white">11</text>
<text x="150" y="282" text-anchor="end" class="label">Organizações</text>
<rect x="175" y="240" width="760.0" height="62" rx="8" fill="#a84f2a"/>
<text x="917.0" y="281" text-anchor="end" font-size="25" font-weight="700" fill="white">16</text>
<text x="150" y="397" text-anchor="end" class="label">Lugares</text>
<rect x="175" y="355" width="380.0" height="62" rx="8" fill="#69445f"/>
<text x="537.0" y="396" text-anchor="end" font-size="25" font-weight="700" fill="white">8</text>
<text x="550" y="532" text-anchor="middle" class="small">contagem de correspondências no corpus fictício</text>
<text x="550" y="565" text-anchor="middle" class="label">Cobertura aparente não equivale a correção</text>
</svg>
