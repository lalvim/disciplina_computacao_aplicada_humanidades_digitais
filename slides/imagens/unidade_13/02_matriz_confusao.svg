<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590" role="img">
<title>Matriz de confusão da auditoria</title>
<desc>Matriz mostra 84 verdadeiros negativos, 36 falsos positivos, 37 falsos negativos e 83 verdadeiros positivos.</desc>
<rect width="1100" height="590" fill="#fffdf7"/>
<style>text{font-family:Aptos,Arial,sans-serif}.title{font-size:28px;font-weight:700;fill:#17324d}.label{font-size:19px;fill:#202a33}.small{font-size:16px;fill:#4b5563}.value{font-size:21px;font-weight:700;fill:#17324d}</style>
<text x="550" y="38" text-anchor="middle" class="title">A acurácia de 0,696 contém 73 erros diferentes</text>
<rect x="355" y="145" width="190" height="190" fill="#176b68" fill-opacity=".82" stroke="white" stroke-width="5"/>
<text x="450.0" y="227" text-anchor="middle" font-size="25" font-weight="700" fill="white">VN</text>
<text x="450.0" y="275" text-anchor="middle" font-size="40" font-weight="700" fill="white">84</text>
<rect x="545" y="145" width="190" height="190" fill="#a84f2a" fill-opacity=".82" stroke="white" stroke-width="5"/>
<text x="640.0" y="227" text-anchor="middle" font-size="25" font-weight="700" fill="white">FP</text>
<text x="640.0" y="275" text-anchor="middle" font-size="40" font-weight="700" fill="white">36</text>
<rect x="355" y="335" width="190" height="190" fill="#69445f" fill-opacity=".82" stroke="white" stroke-width="5"/>
<text x="450.0" y="417" text-anchor="middle" font-size="25" font-weight="700" fill="white">FN</text>
<text x="450.0" y="465" text-anchor="middle" font-size="40" font-weight="700" fill="white">37</text>
<rect x="545" y="335" width="190" height="190" fill="#176b68" fill-opacity=".82" stroke="white" stroke-width="5"/>
<text x="640.0" y="417" text-anchor="middle" font-size="25" font-weight="700" fill="white">VP</text>
<text x="640.0" y="465" text-anchor="middle" font-size="40" font-weight="700" fill="white">83</text>
<text x="545" y="115" text-anchor="middle" class="label">classe prevista</text>
<text x="315" y="335" text-anchor="middle" class="label" transform="rotate(-90 315 335)">classe de referência</text>
<text x="450" y="555" text-anchor="middle" class="small">prevê 0</text>
<text x="640" y="555" text-anchor="middle" class="small">prevê 1</text>
</svg>
