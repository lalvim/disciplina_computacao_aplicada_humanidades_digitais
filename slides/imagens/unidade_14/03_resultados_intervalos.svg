<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590" role="img">
<title>Estimativas, intervalos e baseline</title>
<desc>Três estimativas são mostradas com intervalos em escala de zero a um e linha de referência em 0,5.</desc>
<rect width="1100" height="590" fill="#fffdf7"/>
<style>text{font-family:Aptos,Arial,sans-serif}.title{font-size:28px;font-weight:700;fill:#17324d}.label{font-size:19px;fill:#202a33}.small{font-size:16px;fill:#4b5563}.value{font-size:21px;font-weight:700;fill:#17324d}.mono{font-family:monospace;font-size:16px;fill:#17324d}</style>
<text x="550" y="38" text-anchor="middle" class="title">A figura comunica valor, faixa e referência na mesma escala</text>
<line x1="250" y1="105" x2="250" y2="450" stroke="#d8cdbb"/>
<text x="250" y="490" text-anchor="middle" class="small">0.00</text>
<line x1="430.0" y1="105" x2="430.0" y2="450" stroke="#d8cdbb"/>
<text x="430.0" y="490" text-anchor="middle" class="small">0.25</text>
<line x1="610.0" y1="105" x2="610.0" y2="450" stroke="#d8cdbb"/>
<text x="610.0" y="490" text-anchor="middle" class="small">0.50</text>
<line x1="790.0" y1="105" x2="790.0" y2="450" stroke="#d8cdbb"/>
<text x="790.0" y="490" text-anchor="middle" class="small">0.75</text>
<line x1="970" y1="105" x2="970" y2="450" stroke="#d8cdbb"/>
<text x="970" y="490" text-anchor="middle" class="small">1.00</text>
<line x1="610.0" y1="105" x2="610.0" y2="450" stroke="#4b5563" stroke-width="3" stroke-dasharray="8 6"/>
<text x="220" y="162" text-anchor="end" class="label">modelo principal</text>
<line x1="710.8" y1="155" x2="804.4" y2="155" stroke="#176b68" stroke-width="7"/>
<line x1="710.8" y1="141" x2="710.8" y2="169" stroke="#176b68" stroke-width="4"/>
<line x1="804.4" y1="141" x2="804.4" y2="169" stroke="#176b68" stroke-width="4"/>
<circle cx="761.2" cy="155" r="11" fill="#176b68"/>
<text x="761.2" y="131" text-anchor="middle" class="small">0.71 [0.64, 0.77]</text>
<text x="220" y="277" text-anchor="end" class="label">sensibilidade</text>
<line x1="674.8" y1="270" x2="790.0" y2="270" stroke="#a84f2a" stroke-width="7"/>
<line x1="674.8" y1="256" x2="674.8" y2="284" stroke="#a84f2a" stroke-width="4"/>
<line x1="790.0" y1="256" x2="790.0" y2="284" stroke="#a84f2a" stroke-width="4"/>
<circle cx="739.6" cy="270" r="11" fill="#a84f2a"/>
<text x="739.6" y="246" text-anchor="middle" class="small">0.68 [0.59, 0.75]</text>
<text x="220" y="392" text-anchor="end" class="label">baseline</text>
<line x1="552.4" y1="385" x2="667.5999999999999" y2="385" stroke="#4b5563" stroke-width="7"/>
<line x1="552.4" y1="371" x2="552.4" y2="399" stroke="#4b5563" stroke-width="4"/>
<line x1="667.5999999999999" y1="371" x2="667.5999999999999" y2="399" stroke="#4b5563" stroke-width="4"/>
<circle cx="610.0" cy="385" r="11" fill="#4b5563"/>
<text x="610.0" y="361" text-anchor="middle" class="small">0.50 [0.42, 0.58]</text>
<text x="610" y="535" text-anchor="middle" class="label">estimativa e intervalo · escala completa de 0 a 1</text>
<text x="610" y="568" text-anchor="middle" class="small">linha tracejada = referência 0,50 · dados fictícios</text>
</svg>
