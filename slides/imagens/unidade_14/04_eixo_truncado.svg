<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590" role="img">
<title>Escala completa e eixo truncado</title>
<desc>Os mesmos valores 0,71 e 0,68 parecem próximos em escala zero a um e muito diferentes em escala 0,65 a 0,72.</desc>
<rect width="1100" height="590" fill="#fffdf7"/>
<style>text{font-family:Aptos,Arial,sans-serif}.title{font-size:28px;font-weight:700;fill:#17324d}.label{font-size:19px;fill:#202a33}.small{font-size:16px;fill:#4b5563}.value{font-size:21px;font-weight:700;fill:#17324d}.mono{font-family:monospace;font-size:16px;fill:#17324d}</style>
<text x="550" y="38" text-anchor="middle" class="title">O eixo altera a ênfase visual — não os valores</text>
<rect x="85" y="100" width="400" height="350" fill="#f2eee5" stroke="#d8cdbb"/>
<text x="285.0" y="82" text-anchor="middle" class="value">escala 0–1</text>
<text x="100" y="165" class="small">modelo principal</text>
<rect x="85" y="180" width="284.0" height="58" fill="#176b68"/>
<text x="357.0" y="218" text-anchor="end" font-size="22" font-weight="700" fill="white">0.71</text>
<text x="100" y="310" class="small">sensibilidade</text>
<rect x="85" y="325" width="272.0" height="58" fill="#a84f2a"/>
<text x="345.0" y="363" text-anchor="end" font-size="22" font-weight="700" fill="white">0.68</text>
<text x="85" y="480" class="small">0.00</text>
<text x="485" y="480" text-anchor="end" class="small">1.00</text>
<rect x="610" y="100" width="400" height="350" fill="#f2eee5" stroke="#d8cdbb"/>
<text x="810.0" y="82" text-anchor="middle" class="value">eixo 0,65–0,72</text>
<text x="625" y="165" class="small">modelo principal</text>
<rect x="610" y="180" width="342.9" height="58" fill="#176b68"/>
<text x="940.9" y="218" text-anchor="end" font-size="22" font-weight="700" fill="white">0.71</text>
<text x="625" y="310" class="small">sensibilidade</text>
<rect x="610" y="325" width="171.4" height="58" fill="#a84f2a"/>
<text x="769.4" y="363" text-anchor="end" font-size="22" font-weight="700" fill="white">0.68</text>
<text x="610" y="480" class="small">0.65</text>
<text x="1010" y="480" text-anchor="end" class="small">0.72</text>
<text x="550" y="535" text-anchor="middle" class="label">Diferença numérica em ambos: 0,03</text>
<text x="550" y="570" text-anchor="middle" class="small">Eixo truncado pode ser útil para detalhe, mas precisa ser explícito e justificado.</text>
</svg>
