<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="titulo descricao">
  <title id="titulo">Percurso dos cinco notebooks da Unidade 1</title>
  <desc id="descricao">Cinco etapas conectadas: diagnóstico, pergunta reformulada, mapa de operacionalização, ficha do corpus e proposta inicial de pesquisa.</desc>
  <defs>
    <marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334E68"/>
    </marker>
    <style>
      .titulo { font: 700 30px Arial, sans-serif; fill: #243B53; }
      .numero { font: 700 28px Arial, sans-serif; fill: #FFFFFF; }
      .nome { font: 700 18px Arial, sans-serif; fill: #243B53; }
      .produto { font: 16px Arial, sans-serif; fill: #334E68; }
      .seta { stroke: #334E68; stroke-width: 3; fill: none; marker-end: url(#seta); }
    </style>
  </defs>
  <rect width="1200" height="430" rx="24" fill="#F7F3EA"/>
  <text x="600" y="55" text-anchor="middle" class="titulo">Percurso da Unidade 1</text>

  <path class="seta" d="M220 218 H262"/>
  <path class="seta" d="M450 218 H492"/>
  <path class="seta" d="M680 218 H722"/>
  <path class="seta" d="M910 218 H952"/>

  <g transform="translate(30 105)">
    <rect width="190" height="225" rx="18" fill="#FFFFFF" stroke="#486581" stroke-width="2"/>
    <circle cx="95" cy="48" r="30" fill="#2B6CB0"/>
    <text x="95" y="58" text-anchor="middle" class="numero">00</text>
    <text x="95" y="105" text-anchor="middle" class="nome">Orientação</text>
    <text x="95" y="145" text-anchor="middle" class="produto"><tspan x="95">Diagnóstico</tspan><tspan x="95" dy="22">inicial</tspan></text>
  </g>
  <g transform="translate(260 105)">
    <rect width="190" height="225" rx="18" fill="#FFFFFF" stroke="#486581" stroke-width="2"/>
    <circle cx="95" cy="48" r="30" fill="#287271"/>
    <text x="95" y="58" text-anchor="middle" class="numero">01</text>
    <text x="95" y="105" text-anchor="middle" class="nome">Pergunta</text>
    <text x="95" y="145" text-anchor="middle" class="produto"><tspan x="95">Pergunta</tspan><tspan x="95" dy="22">reformulada</tspan></text>
  </g>
  <g transform="translate(490 105)">
    <rect width="190" height="225" rx="18" fill="#FFFFFF" stroke="#486581" stroke-width="2"/>
    <circle cx="95" cy="48" r="30" fill="#8C3D18"/>
    <text x="95" y="58" text-anchor="middle" class="numero">02</text>
    <text x="95" y="105" text-anchor="middle" class="nome">Representação</text>
    <text x="95" y="145" text-anchor="middle" class="produto"><tspan x="95">Mapa de</tspan><tspan x="95" dy="22">operacionalização</tspan></text>
  </g>
  <g transform="translate(720 105)">
    <rect width="190" height="225" rx="18" fill="#FFFFFF" stroke="#486581" stroke-width="2"/>
    <circle cx="95" cy="48" r="30" fill="#6B4C8A"/>
    <text x="95" y="58" text-anchor="middle" class="numero">03</text>
    <text x="95" y="105" text-anchor="middle" class="nome">Corpus</text>
    <text x="95" y="145" text-anchor="middle" class="produto"><tspan x="95">Ficha do</tspan><tspan x="95" dy="22">corpus</tspan></text>
  </g>
  <g transform="translate(950 105)">
    <rect width="220" height="225" rx="18" fill="#E6F4F1" stroke="#287271" stroke-width="3"/>
    <circle cx="110" cy="48" r="30" fill="#287271"/>
    <text x="110" y="58" text-anchor="middle" class="numero">04</text>
    <text x="110" y="105" text-anchor="middle" class="nome">Integração</text>
    <text x="110" y="145" text-anchor="middle" class="produto"><tspan x="110">Proposta inicial</tspan><tspan x="110" dy="22">de pesquisa</tspan></text>
  </g>
  <text x="600" y="385" text-anchor="middle" class="produto">Cada produto parcial alimenta a etapa seguinte e pode ser revisto.</text>
</svg>
