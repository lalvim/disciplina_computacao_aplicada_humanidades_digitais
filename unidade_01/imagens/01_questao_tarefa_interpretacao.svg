<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="titulo descricao">
  <title id="titulo">Da questão humanística à interpretação</title>
  <desc id="descricao">Quatro blocos conectados mostram questão humanística ampla, pergunta delimitada, tarefa computacional e interpretação humanística. Uma seta de retorno indica releitura e reformulação.</desc>
  <defs>
    <marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#334E68"/></marker>
    <style>
      .titulo { font: 700 30px Arial, sans-serif; fill: #243B53; }
      .rotulo { font: 700 18px Arial, sans-serif; fill: #243B53; }
      .texto { font: 15px Arial, sans-serif; fill: #334E68; }
      .seta { stroke: #334E68; stroke-width: 3; fill: none; marker-end: url(#seta); }
    </style>
  </defs>
  <rect width="1200" height="480" rx="24" fill="#F7F3EA"/>
  <text x="600" y="52" text-anchor="middle" class="titulo">Da questão à interpretação</text>
  <path class="seta" d="M280 215 H315"/><path class="seta" d="M570 215 H605"/><path class="seta" d="M860 215 H895"/>

  <g transform="translate(25 115)">
    <rect width="255" height="205" rx="18" fill="#D9EAF7" stroke="#2B6CB0" stroke-width="2"/>
    <text x="127" y="42" text-anchor="middle" class="rotulo">Questão ampla</text>
    <text x="127" y="82" text-anchor="middle" class="texto"><tspan x="127">Como ideias de progresso</tspan><tspan x="127" dy="22">participaram da vida social?</tspan></text>
  </g>
  <g transform="translate(315 115)">
    <rect width="255" height="205" rx="18" fill="#E6F4F1" stroke="#287271" stroke-width="2"/>
    <text x="127" y="42" text-anchor="middle" class="rotulo">Pergunta delimitada</text>
    <text x="127" y="82" text-anchor="middle" class="texto"><tspan x="127">Fenômeno + contexto</tspan><tspan x="127" dy="22">+ fontes + recorte</tspan></text>
  </g>
  <g transform="translate(605 115)">
    <rect width="255" height="205" rx="18" fill="#F6E8DF" stroke="#8C3D18" stroke-width="2"/>
    <text x="127" y="42" text-anchor="middle" class="rotulo">Tarefa computacional</text>
    <text x="127" y="82" text-anchor="middle" class="texto"><tspan x="127">Selecionar, contar</tspan><tspan x="127" dy="22">e comparar registros</tspan><tspan x="127" dy="30">Produz resultados</tspan></text>
  </g>
  <g transform="translate(895 115)">
    <rect width="280" height="205" rx="18" fill="#EEE7F5" stroke="#6B4C8A" stroke-width="2"/>
    <text x="140" y="42" text-anchor="middle" class="rotulo">Interpretação</text>
    <text x="140" y="82" text-anchor="middle" class="texto"><tspan x="140">Reler documentos,</tspan><tspan x="140" dy="22">contextualizar sentidos</tspan><tspan x="140" dy="22">e limitar conclusões</tspan></text>
  </g>
  <path d="M1035 335 C1035 405 165 405 165 335" class="seta" stroke-dasharray="8 7"/>
  <text x="600" y="450" text-anchor="middle" class="texto">Releitura e reformulação</text>
</svg>
