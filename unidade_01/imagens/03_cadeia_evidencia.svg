<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="titulo descricao">
  <title id="titulo">Cadeia de produção da evidência computacional</title>
  <desc id="descricao">Oito etapas conectadas: fonte, seleção, digitalização, descrição, transformação, operação, resultado e interpretação. Uma seta tracejada retorna da interpretação à fonte para indicar revisão.</desc>
  <defs>
    <marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#334E68"/></marker>
    <style>
      .titulo { font: 700 30px Arial, sans-serif; fill: #243B53; }
      .rotulo { font: 700 18px Arial, sans-serif; fill: #243B53; }
      .pergunta { font: 14px Arial, sans-serif; fill: #334E68; }
      .nota { font: 15px Arial, sans-serif; fill: #486581; }
      .seta { stroke: #334E68; stroke-width: 3; fill: none; marker-end: url(#seta); }
    </style>
  </defs>
  <rect width="1200" height="650" rx="24" fill="#F7F3EA"/>
  <text x="600" y="50" text-anchor="middle" class="titulo">A evidência depende de toda a cadeia</text>

  <path class="seta" d="M275 175 H325"/><path class="seta" d="M550 175 H600"/><path class="seta" d="M825 175 H875"/>
  <path class="seta" d="M1000 245 V375"/>
  <path class="seta" d="M875 445 H825"/><path class="seta" d="M600 445 H550"/><path class="seta" d="M325 445 H275"/>

  <g transform="translate(25 105)"><rect width="250" height="140" rx="18" fill="#D9EAF7" stroke="#2B6CB0" stroke-width="2"/><text x="125" y="46" text-anchor="middle" class="rotulo">Fonte</text><text x="125" y="82" text-anchor="middle" class="pergunta"><tspan x="125">Quem produziu?</tspan><tspan x="125" dy="20">Em que contexto?</tspan></text></g>
  <g transform="translate(325 105)"><rect width="225" height="140" rx="18" fill="#E6F4F1" stroke="#287271" stroke-width="2"/><text x="112" y="46" text-anchor="middle" class="rotulo">Seleção</text><text x="112" y="82" text-anchor="middle" class="pergunta"><tspan x="112">O que entrou?</tspan><tspan x="112" dy="20">O que ficou fora?</tspan></text></g>
  <g transform="translate(600 105)"><rect width="225" height="140" rx="18" fill="#F6E8DF" stroke="#8C3D18" stroke-width="2"/><text x="112" y="46" text-anchor="middle" class="rotulo">Digitalização</text><text x="112" y="82" text-anchor="middle" class="pergunta"><tspan x="112">O que foi perdido</tspan><tspan x="112" dy="20">ou normalizado?</tspan></text></g>
  <g transform="translate(875 105)"><rect width="300" height="140" rx="18" fill="#EEE7F5" stroke="#6B4C8A" stroke-width="2"/><text x="150" y="46" text-anchor="middle" class="rotulo">Descrição</text><text x="150" y="82" text-anchor="middle" class="pergunta"><tspan x="150">Quem definiu campos,</tspan><tspan x="150" dy="20">metadados e categorias?</tspan></text></g>

  <g transform="translate(25 375)"><rect width="250" height="140" rx="18" fill="#E6F4F1" stroke="#287271" stroke-width="3"/><text x="125" y="46" text-anchor="middle" class="rotulo">Interpretação</text><text x="125" y="82" text-anchor="middle" class="pergunta"><tspan x="125">Que afirmação é</tspan><tspan x="125" dy="20">sustentada?</tspan></text></g>
  <g transform="translate(325 375)"><rect width="225" height="140" rx="18" fill="#EEE7F5" stroke="#6B4C8A" stroke-width="2"/><text x="112" y="46" text-anchor="middle" class="rotulo">Resultado</text><text x="112" y="82" text-anchor="middle" class="pergunta"><tspan x="112">O que apareceu?</tspan><tspan x="112" dy="20">Há ausências?</tspan></text></g>
  <g transform="translate(600 375)"><rect width="225" height="140" rx="18" fill="#F6E8DF" stroke="#8C3D18" stroke-width="2"/><text x="112" y="46" text-anchor="middle" class="rotulo">Operação</text><text x="112" y="82" text-anchor="middle" class="pergunta"><tspan x="112">O que exatamente</tspan><tspan x="112" dy="20">foi calculado?</tspan></text></g>
  <g transform="translate(875 375)"><rect width="300" height="140" rx="18" fill="#D9EAF7" stroke="#2B6CB0" stroke-width="2"/><text x="150" y="46" text-anchor="middle" class="rotulo">Transformação</text><text x="150" y="82" text-anchor="middle" class="pergunta"><tspan x="150">Valores foram agrupados,</tspan><tspan x="150" dy="20">limpos ou alterados?</tspan></text></g>

  <path d="M150 375 C65 345 65 275 150 245" class="seta" stroke-dasharray="8 7"/>
  <text x="600" y="575" text-anchor="middle" class="nota">O resultado pode exigir retorno às fontes, às categorias e ao corpus.</text>
</svg>
