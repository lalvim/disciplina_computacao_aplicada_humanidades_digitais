<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Exercícios — Unidade 2</title>
<style>
body{font-family:system-ui,sans-serif;max-width:900px;margin:auto;padding:2rem;line-height:1.5;background:#f7f4ee;color:#24211d}
h1{color:#513b2c} fieldset{background:white;border:1px solid #c9bba9;border-radius:8px;margin:1rem 0;padding:1rem}
legend{font-weight:700} label{display:block;padding:.35rem} button{padding:.7rem 1rem;font-weight:700}
.retorno{margin-top:.7rem;padding:.6rem;border-left:4px solid #765b43;background:#f2eadf} a{color:#60452f}
</style></head><body>
<h1>Exercícios de revisão — Unidade 2</h1>
<p>Marque uma alternativa por questão. A correção apresenta explicações, não apenas a letra.</p>
<noscript><p>JavaScript está desativado. Use a <a href="exercicios_unidade_02_texto.md">versão textual</a>.</p></noscript>
<main id="quiz"></main><button id="corrigir">Corrigir respostas</button>
<p id="resultado" role="status" aria-live="polite"></p>
<script>
const questoes=[{"topico": "População e corpus", "enunciado": "Qual formulação distingue corretamente população de interesse e corpus?", "alternativas": ["São sempre conjuntos idênticos.", "A população delimita o alcance pretendido; o corpus reúne casos efetivamente selecionados.", "Corpus é apenas uma amostra probabilística.", "População é o conjunto já digitalizado."], "correta": 1, "explicacao": "A população se relaciona ao alcance da pergunta; o corpus resulta das condições de acesso e dos critérios adotados."}, {"topico": "População e corpus", "enunciado": "Usar somente itens digitalizados delimita principalmente:", "alternativas": ["o fenômeno histórico", "a população de interesse", "a população acessível e o corpus", "a unidade de análise"], "correta": 2, "explicacao": "Digitalização é uma condição de infraestrutura e acesso, não uma propriedade natural do fenômeno."}, {"topico": "Fontes", "enunciado": "Quando um catálogo institucional pode ser fonte primária?", "alternativas": ["Nunca.", "Somente se estiver em CSV.", "Quando a pergunta investiga práticas de catalogação ou da instituição.", "Sempre que substituir os documentos descritos."], "correta": 2, "explicacao": "O papel de uma fonte depende da relação com a pergunta."}, {"topico": "Fontes", "enunciado": "Uma tabela transcrita de documentos deve ser tratada como:", "alternativas": ["o próprio fenômeno", "dado derivado ligado às fontes e decisões de transcrição", "fonte sem proveniência", "prova autossuficiente"], "correta": 1, "explicacao": "A representação derivada precisa manter rastreabilidade até as fontes."}, {"topico": "Seleção", "enunciado": "Qual critério é mais reproduzível?", "alternativas": ["Documentos relevantes.", "Itens interessantes.", "Registros de 1890 a 1900 com ano documentado.", "Fontes de boa qualidade."], "correta": 2, "explicacao": "O intervalo e o campo tornam a regra verificável, embora a justificativa ainda precise ser defendida."}, {"topico": "Seleção", "enunciado": "Por que registrar motivos de exclusão por item?", "alternativas": ["Para eliminar a interpretação.", "Para auditar consequências e reproduzir a seleção.", "Para provar representatividade.", "Para corrigir silêncios históricos."], "correta": 1, "explicacao": "O registro permite reconstituir regras e examinar perdas."}, {"topico": "Cobertura", "enunciado": "Cobertura e representatividade são:", "alternativas": ["sinônimos", "atributos garantidos por bases grandes", "conceitos distintos; representatividade depende do desenho e da inferência", "irrelevantes em corpus"], "correta": 2, "explicacao": "Boa cobertura em uma dimensão não garante representação adequada da população."}, {"topico": "Cobertura", "enunciado": "Comparar a distribuição de grupos antes e depois do filtro permite:", "alternativas": ["medir a importância histórica dos grupos", "observar como a seleção altera o catálogo disponível", "provar causalidade", "recuperar fontes inexistentes"], "correta": 1, "explicacao": "A comparação diagnostica efeitos do recorte sobre os dados disponíveis."}, {"topico": "Viés de seleção", "enunciado": "Selecionar apenas materiais digitalizados pode favorecer:", "alternativas": ["aleatoriamente todos os casos", "instituições e gêneros com mais condições de digitalização", "somente valores ausentes", "a persistência dos identificadores"], "correta": 1, "explicacao": "Digitalização pode estar sistematicamente associada a recursos, formatos e políticas."}, {"topico": "Ausências e silêncios", "enunciado": "Qual exemplo é um silêncio documental, e não apenas um valor nulo?", "alternativas": ["Uma célula sem ano em registro existente.", "Experiências que não foram registradas ou preservadas.", "Um erro de digitação.", "Uma categoria escrita de duas formas."], "correta": 1, "explicacao": "A ausência no processo documental não se resolve preenchendo a tabela."}, {"topico": "Metadados", "enunciado": "Qual é um metadado administrativo?", "alternativas": ["Condição de direitos e acesso.", "Tema interpretado no argumento final.", "Hipótese causal.", "Resultado de um modelo futuro."], "correta": 0, "explicacao": "Direitos, acesso, formatos e responsáveis apoiam gestão e uso."}, {"topico": "Dicionário de dados", "enunciado": "Um dicionário de dados deve registrar:", "alternativas": ["somente nomes das colunas", "definições, tipos, regras, origem e limitações", "apenas código Python", "somente resultados estatísticos"], "correta": 1, "explicacao": "O dicionário explicita o significado e as restrições dos campos."}, {"topico": "Identificadores", "enunciado": "Qual característica é desejável em um identificador?", "alternativas": ["Mudar quando o título é corrigido.", "Ser único no escopo e relativamente persistente.", "Ser sempre o número da linha.", "Conter todos os atributos do item."], "correta": 1, "explicacao": "Identificadores devem sustentar relações mesmo quando descrições mudam."}, {"topico": "Proveniência", "enunciado": "Qual registro de proveniência é mais completo?", "alternativas": ["Apenas a URL.", "Origem, agente, data/versão, condições e transformações.", "Somente o nome do arquivo.", "A contagem de linhas."], "correta": 1, "explicacao": "Proveniência documenta a cadeia de produção e transformação."}, {"topico": "Ética", "enunciado": "Dados publicamente acessíveis:", "alternativas": ["podem sempre ser republicados sem análise", "dispensam segurança", "ainda exigem avaliação de finalidade, riscos, direitos e contexto", "não podem ser pesquisados"], "correta": 2, "explicacao": "Acesso técnico não encerra as responsabilidades éticas ou legais."}, {"topico": "Ética", "enunciado": "Os princípios CARE enfatizam, entre outros aspectos:", "alternativas": ["benefício coletivo e autoridade para controlar", "apenas abertura irrestrita", "eliminação de metadados", "neutralidade das bases"], "correta": 0, "explicacao": "CARE centra pessoas, propósitos, direitos e interesses indígenas."}, {"topico": "FAIR", "enunciado": "Nos princípios FAIR, dizer que dados são acessíveis significa necessariamente que:", "alternativas": ["qualquer pessoa pode baixá-los sem restrição", "existe um procedimento explícito de acesso, que pode incluir autenticação e autorização", "os dados não têm direitos associados", "todos os registros devem ser publicados em uma planilha"], "correta": 1, "explicacao": "Acessibilidade requer um protocolo claro; dados protegidos podem continuar sujeitos a controle de acesso."}, {"topico": "FAIR e CARE", "enunciado": "Qual afirmação relaciona adequadamente FAIR e CARE?", "alternativas": ["CARE substitui todos os requisitos técnicos de FAIR.", "Uma base FAIR é automaticamente justa.", "FAIR focaliza condições de localização e reuso; CARE acrescenta benefício, autoridade, responsabilidade e ética no contexto dos dados indígenas.", "Os dois conjuntos de princípios exigem abertura irrestrita."], "correta": 2, "explicacao": "As lentes são complementares: capacidade técnica de reuso não resolve sozinha autoridade, direitos ou benefícios."}, {"topico": "Datasheets", "enunciado": "Qual conjunto corresponde às partes propostas em Datasheets for Datasets?", "alternativas": ["Somente título, autoria e palavras-chave.", "Motivação, composição, coleta, processamento, usos, distribuição e manutenção.", "Apenas acurácia e desempenho de modelos.", "Somente licença e endereço eletrônico."], "correta": 1, "explicacao": "A proposta acompanha o ciclo de vida e explicita escolhas, usos, riscos, distribuição e manutenção."}, {"topico": "Questões legais", "enunciado": "Diante de dados pessoais em um projeto real, o estudante deve:", "alternativas": ["seguir apenas este notebook", "consultar regras aplicáveis e instâncias institucionais competentes", "publicar primeiro e avaliar depois", "presumir consentimento"], "correta": 1, "explicacao": "O material é educativo e não substitui avaliação ética, institucional ou jurídica."}, {"topico": "Integração", "enunciado": "Qual protocolo é mais defensável?", "alternativas": ["Base grande sem documentação.", "Seleção explícita, cobertura discutida, proveniência e riscos registrados.", "Apenas arquivos disponíveis online.", "Tabela limpa sem ligação com as fontes."], "correta": 1, "explicacao": "Adequação resulta da coerência entre pergunta, seleção, documentação, limites e responsabilidades."}];
const quiz=document.getElementById("quiz");
questoes.forEach((q,i)=>{
 const f=document.createElement("fieldset"); const l=document.createElement("legend");
 l.textContent=`${i+1}. ${q.enunciado}`; f.appendChild(l);
 q.alternativas.forEach((a,j)=>{const label=document.createElement("label");
 label.innerHTML=`<input type="radio" name="q${i}" value="${j}"> ${String.fromCharCode(65+j)}. ${a}`; f.appendChild(label);});
 const r=document.createElement("div"); r.className="retorno"; r.hidden=true; f.appendChild(r); quiz.appendChild(f);
});
document.getElementById("corrigir").addEventListener("click",()=>{
 let acertos=0; [...quiz.children].forEach((f,i)=>{const m=f.querySelector("input:checked"); const r=f.querySelector(".retorno");
 const ok=m&&Number(m.value)===questoes[i].correta; if(ok)acertos++; r.hidden=false;
 r.textContent=(ok?"Correto. ":"Resposta esperada: "+String.fromCharCode(65+questoes[i].correta)+". ")+questoes[i].explicacao;});
 document.getElementById("resultado").textContent=`Resultado: ${acertos} de ${questoes.length}.`;
});
</script></body></html>
