<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540"
 role="img" aria-labelledby="titulo descricao">
<title id="titulo">Percurso da Unidade 2</title>
<desc id="descricao">Cinco etapas conectam diagnóstico, seleção, cobertura, documentação e oficina; uma seta de retorno indica revisão das decisões.</desc>
<defs>
  <marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="3"
   orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#17324d"/>
  </marker>
  <style>
    .titulo { font: 700 30px system-ui, sans-serif; fill: #17324d; }
    .subtitulo { font: 700 19px system-ui, sans-serif; fill: #17324d; }
    .corpo { font: 16px system-ui, sans-serif; fill: #17324d; }
    .nota { font: italic 15px system-ui, sans-serif; fill: #53606c; }
    .numero { font: 700 25px system-ui, sans-serif; fill: #fff; }
    .seta { stroke: #17324d; stroke-width: 3; fill: none; marker-end: url(#seta); }
    .tracejada { stroke-dasharray: 9 7; }
  </style>
</defs>
<rect width="1200" height="540" rx="28" fill="#fbf4e8"/>
<text x="600" y="48" class="titulo" text-anchor="middle"><tspan x="600" dy="0">Da pergunta ao protocolo da base</tspan></text><rect x="38" y="105" width="195" height="175" rx="18" fill="#dbe8ec" stroke="#17324d" stroke-width="3"/><circle cx="135.5" cy="130" r="22" fill="#17324d"/><text x="135.5" y="138" class="numero" text-anchor="middle"><tspan x="135.5" dy="0">00</tspan></text><text x="135.5" y="175" class="subtitulo" text-anchor="middle"><tspan x="135.5" dy="0">Diagnóstico</tspan></text><text x="135.5" y="210" class="corpo" text-anchor="middle"><tspan x="135.5" dy="0">adequação</tspan><tspan x="135.5" dy="22">e limites</tspan></text><path class="seta" d="M236,192 H263"/><rect x="271" y="105" width="195" height="175" rx="18" fill="#d8ebe7" stroke="#256b6b" stroke-width="3"/><circle cx="368.5" cy="130" r="22" fill="#256b6b"/><text x="368.5" y="138" class="numero" text-anchor="middle"><tspan x="368.5" dy="0">01</tspan></text><text x="368.5" y="175" class="subtitulo" text-anchor="middle"><tspan x="368.5" dy="0">Seleção</tspan></text><text x="368.5" y="210" class="corpo" text-anchor="middle"><tspan x="368.5" dy="0">população</tspan><tspan x="368.5" dy="22">e corpus</tspan></text><path class="seta" d="M469,192 H496"/><rect x="504" y="105" width="195" height="175" rx="18" fill="#f2ddd2" stroke="#a44f32" stroke-width="3"/><circle cx="601.5" cy="130" r="22" fill="#a44f32"/><text x="601.5" y="138" class="numero" text-anchor="middle"><tspan x="601.5" dy="0">02</tspan></text><text x="601.5" y="175" class="subtitulo" text-anchor="middle"><tspan x="601.5" dy="0">Cobertura</tspan></text><text x="601.5" y="210" class="corpo" text-anchor="middle"><tspan x="601.5" dy="0">vieses</tspan><tspan x="601.5" dy="22">e silêncios</tspan></text><path class="seta" d="M702,192 H729"/><rect x="737" y="105" width="195" height="175" rx="18" fill="#eadde7" stroke="#69445f" stroke-width="3"/><circle cx="834.5" cy="130" r="22" fill="#69445f"/><text x="834.5" y="138" class="numero" text-anchor="middle"><tspan x="834.5" dy="0">03</tspan></text><text x="834.5" y="175" class="subtitulo" text-anchor="middle"><tspan x="834.5" dy="0">Documentação</tspan></text><text x="834.5" y="210" class="corpo" text-anchor="middle"><tspan x="834.5" dy="0">metadados</tspan><tspan x="834.5" dy="22">e proveniência</tspan></text><path class="seta" d="M935,192 H962"/><rect x="970" y="105" width="195" height="175" rx="18" fill="#f1e2bd" stroke="#8a6528" stroke-width="3"/><circle cx="1067.5" cy="130" r="22" fill="#8a6528"/><text x="1067.5" y="138" class="numero" text-anchor="middle"><tspan x="1067.5" dy="0">04</tspan></text><text x="1067.5" y="175" class="subtitulo" text-anchor="middle"><tspan x="1067.5" dy="0">Oficina</tspan></text><text x="1067.5" y="210" class="corpo" text-anchor="middle"><tspan x="1067.5" dy="0">protocolo</tspan><tspan x="1067.5" dy="22">defensável</tspan></text><rect x="38" y="318" width="195" height="54" rx="12" fill="#fffdf8" stroke="#d8b26e" stroke-width="2"/><text x="135.5" y="350" class="corpo" text-anchor="middle"><tspan x="135.5" dy="0">pergunta situada</tspan></text><rect x="271" y="318" width="195" height="54" rx="12" fill="#fffdf8" stroke="#d8b26e" stroke-width="2"/><text x="368.5" y="350" class="corpo" text-anchor="middle"><tspan x="368.5" dy="0">protocolo de seleção</tspan></text><rect x="504" y="318" width="195" height="54" rx="12" fill="#fffdf8" stroke="#d8b26e" stroke-width="2"/><text x="601.5" y="350" class="corpo" text-anchor="middle"><tspan x="601.5" dy="0">matriz de cobertura</tspan></text><rect x="737" y="318" width="195" height="54" rx="12" fill="#fffdf8" stroke="#d8b26e" stroke-width="2"/><text x="834.5" y="350" class="corpo" text-anchor="middle"><tspan x="834.5" dy="0">dicionário + cadeia</tspan></text><rect x="970" y="318" width="195" height="54" rx="12" fill="#fffdf8" stroke="#d8b26e" stroke-width="2"/><text x="1067.5" y="350" class="corpo" text-anchor="middle"><tspan x="1067.5" dy="0">desenho revisado</tspan></text><path class="seta tracejada" d="M1085,410 C1085,530 115,530 115,410"/><text x="600" y="474" class="nota" text-anchor="middle"><tspan x="600" dy="0">Resultados e limites fazem o projeto retornar às decisões anteriores</tspan></text>
</svg>
