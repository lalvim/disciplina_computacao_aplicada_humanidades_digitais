<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540"
 role="img" aria-labelledby="titulo descricao">
<title id="titulo">Percurso da Unidade 2</title>
<desc id="descricao">Seis etapas conectam diagnóstico, seleção, cobertura, documentação, governança e oficina; uma seta de retorno indica revisão das decisões.</desc>
<defs>
  <marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="3"
   orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#17324d"/>
  </marker>
  <style>
    .titulo { font: 700 30px system-ui, sans-serif; fill: #17324d; }
    .subtitulo { font: 700 19px system-ui, sans-serif; fill: #17324d; }
    .corpo { font: 16px system-ui, sans-serif; fill: #17324d; }
    .nota { font: italic 15px system-ui, sans-serif; fill: #53606c; }
    .numero { font: 700 25px system-ui, sans-serif; fill: #fff; }
    .seta { stroke: #17324d; stroke-width: 3; fill: none; marker-end: url(#seta); }
    .tracejada { stroke-dasharray: 9 7; }
  </style>
</defs>
<rect width="1200" height="540" rx="28" fill="#fbf4e8"/>
<text x="600" y="48" class="titulo" text-anchor="middle"><tspan x="600" dy="0">Da pergunta ao protocolo da base</tspan></text><rect x="22" y="105" width="172" height="175" rx="18" fill="#dbe8ec" stroke="#17324d" stroke-width="3"/><circle cx="108" cy="130" r="22" fill="#17324d"/><text x="108" y="138" class="numero" text-anchor="middle"><tspan x="108" dy="0">00</tspan></text><text x="108" y="175" class="subtitulo" text-anchor="middle"><tspan x="108" dy="0">Diagnóstico</tspan></text><text x="108" y="210" class="corpo" text-anchor="middle"><tspan x="108" dy="0">adequação</tspan><tspan x="108" dy="22">e limites</tspan></text><path class="seta" d="M197,192 H211"/><rect x="218" y="105" width="172" height="175" rx="18" fill="#d8ebe7" stroke="#256b6b" stroke-width="3"/><circle cx="304" cy="130" r="22" fill="#256b6b"/><text x="304" y="138" class="numero" text-anchor="middle"><tspan x="304" dy="0">01</tspan></text><text x="304" y="175" class="subtitulo" text-anchor="middle"><tspan x="304" dy="0">Seleção</tspan></text><text x="304" y="210" class="corpo" text-anchor="middle"><tspan x="304" dy="0">população</tspan><tspan x="304" dy="22">e corpus</tspan></text><path class="seta" d="M393,192 H407"/><rect x="414" y="105" width="172" height="175" rx="18" fill="#f2ddd2" stroke="#a44f32" stroke-width="3"/><circle cx="500" cy="130" r="22" fill="#a44f32"/><text x="500" y="138" class="numero" text-anchor="middle"><tspan x="500" dy="0">02</tspan></text><text x="500" y="175" class="subtitulo" text-anchor="middle"><tspan x="500" dy="0">Cobertura</tspan></text><text x="500" y="210" class="corpo" text-anchor="middle"><tspan x="500" dy="0">vieses</tspan><tspan x="500" dy="22">e silêncios</tspan></text><path class="seta" d="M589,192 H603"/><rect x="610" y="105" width="172" height="175" rx="18" fill="#eadde7" stroke="#69445f" stroke-width="3"/><circle cx="696" cy="130" r="22" fill="#69445f"/><text x="696" y="138" class="numero" text-anchor="middle"><tspan x="696" dy="0">03</tspan></text><text x="696" y="175" class="subtitulo" text-anchor="middle"><tspan x="696" dy="0">Documentação</tspan></text><text x="696" y="210" class="corpo" text-anchor="middle"><tspan x="696" dy="0">metadados</tspan><tspan x="696" dy="22">e proveniência</tspan></text><path class="seta" d="M785,192 H799"/><rect x="806" y="105" width="172" height="175" rx="18" fill="#f1e2bd" stroke="#8a6528" stroke-width="3"/><circle cx="892" cy="130" r="22" fill="#8a6528"/><text x="892" y="138" class="numero" text-anchor="middle"><tspan x="892" dy="0">04</tspan></text><text x="892" y="175" class="subtitulo" text-anchor="middle"><tspan x="892" dy="0">Governança</tspan></text><text x="892" y="210" class="corpo" text-anchor="middle"><tspan x="892" dy="0">FAIR, CARE</tspan><tspan x="892" dy="22">e datasheets</tspan></text><path class="seta" d="M981,192 H995"/><rect x="1002" y="105" width="172" height="175" rx="18" fill="#dbe8ec" stroke="#17324d" stroke-width="3"/><circle cx="1088" cy="130" r="22" fill="#17324d"/><text x="1088" y="138" class="numero" text-anchor="middle"><tspan x="1088" dy="0">05</tspan></text><text x="1088" y="175" class="subtitulo" text-anchor="middle"><tspan x="1088" dy="0">Oficina</tspan></text><text x="1088" y="210" class="corpo" text-anchor="middle"><tspan x="1088" dy="0">protocolo</tspan><tspan x="1088" dy="22">defensável</tspan></text><rect x="22" y="318" width="172" height="54" rx="12" fill="#fffdf8" stroke="#d8b26e" stroke-width="2"/><text x="108" y="350" class="corpo" text-anchor="middle"><tspan x="108" dy="0">pergunta situada</tspan></text><rect x="218" y="318" width="172" height="54" rx="12" fill="#fffdf8" stroke="#d8b26e" stroke-width="2"/><text x="304" y="350" class="corpo" text-anchor="middle"><tspan x="304" dy="0">protocolo de seleção</tspan></text><rect x="414" y="318" width="172" height="54" rx="12" fill="#fffdf8" stroke="#d8b26e" stroke-width="2"/><text x="500" y="350" class="corpo" text-anchor="middle"><tspan x="500" dy="0">matriz de cobertura</tspan></text><rect x="610" y="318" width="172" height="54" rx="12" fill="#fffdf8" stroke="#d8b26e" stroke-width="2"/><text x="696" y="350" class="corpo" text-anchor="middle"><tspan x="696" dy="0">dicionário + cadeia</tspan></text><rect x="806" y="318" width="172" height="54" rx="12" fill="#fffdf8" stroke="#d8b26e" stroke-width="2"/><text x="892" y="350" class="corpo" text-anchor="middle"><tspan x="892" dy="0">ficha de governança</tspan></text><rect x="1002" y="318" width="172" height="54" rx="12" fill="#fffdf8" stroke="#d8b26e" stroke-width="2"/><text x="1088" y="350" class="corpo" text-anchor="middle"><tspan x="1088" dy="0">desenho revisado</tspan></text><path class="seta tracejada" d="M1090,410 C1090,530 108,530 108,410"/><text x="600" y="474" class="nota" text-anchor="middle"><tspan x="600" dy="0">Resultados e limites fazem o projeto retornar às decisões anteriores</tspan></text>
</svg>
