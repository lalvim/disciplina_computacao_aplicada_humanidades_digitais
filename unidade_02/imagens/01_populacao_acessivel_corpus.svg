<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580"
 role="img" aria-labelledby="titulo descricao">
<title id="titulo">População de interesse, população acessível e corpus</title>
<desc id="descricao">Conjuntos aninhados mostram que o corpus é delimitado dentro da população acessível, mediada por produção, preservação, acesso e critérios de seleção.</desc>
<defs>
  <marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="3"
   orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#17324d"/>
  </marker>
  <style>
    .titulo { font: 700 30px system-ui, sans-serif; fill: #17324d; }
    .subtitulo { font: 700 19px system-ui, sans-serif; fill: #17324d; }
    .corpo { font: 16px system-ui, sans-serif; fill: #17324d; }
    .nota { font: italic 15px system-ui, sans-serif; fill: #53606c; }
    .numero { font: 700 25px system-ui, sans-serif; fill: #fff; }
    .seta { stroke: #17324d; stroke-width: 3; fill: none; marker-end: url(#seta); }
    .tracejada { stroke-dasharray: 9 7; }
  </style>
</defs>
<rect width="1200" height="580" rx="28" fill="#fbf4e8"/>
<text x="600" y="47" class="titulo" text-anchor="middle"><tspan x="600" dy="0">Três conjuntos relacionados, mas não equivalentes</tspan></text><rect x="70" y="90" width="760" height="440" rx="35" fill="#dbe8ec" stroke="#17324d" stroke-width="3"/><text x="105" y="130" class="subtitulo" text-anchor="start"><tspan x="105" dy="0">População de interesse</tspan></text><text x="105" y="160" class="corpo" text-anchor="start"><tspan x="105" dy="0">casos sobre os quais se deseja argumentar</tspan></text><rect x="165" y="195" width="575" height="285" rx="30" fill="#d8ebe7" stroke="#256b6b" stroke-width="3"/><text x="200" y="235" class="subtitulo" text-anchor="start"><tspan x="200" dy="0">População acessível</tspan></text><text x="200" y="265" class="corpo" text-anchor="start"><tspan x="200" dy="0">casos localizáveis e consultáveis</tspan><tspan x="200" dy="22">nas condições do projeto</tspan></text><rect x="295" y="315" width="315" height="115" rx="26" fill="#f2ddd2" stroke="#a44f32" stroke-width="3"/><text x="452" y="355" class="subtitulo" text-anchor="middle"><tspan x="452" dy="0">Corpus</tspan></text><text x="452" y="385" class="corpo" text-anchor="middle"><tspan x="452" dy="0">casos delimitados por</tspan><tspan x="452" dy="22">critérios explícitos</tspan></text><rect x="885" y="115" width="245" height="310" rx="18" fill="#fffdf8" stroke="#69445f" stroke-width="3"/><text x="1007.5" y="147" class="subtitulo" text-anchor="middle"><tspan x="1007.5" dy="0">Mediações</tspan></text><text x="1007.5" y="180" class="corpo" text-anchor="middle"><tspan x="1007.5" dy="0">produção</tspan><tspan x="1007.5" dy="22">preservação</tspan><tspan x="1007.5" dy="22">catalogação</tspan><tspan x="1007.5" dy="22">localização</tspan><tspan x="1007.5" dy="22">digitalização</tspan><tspan x="1007.5" dy="22">acesso</tspan><tspan x="1007.5" dy="22">seleção</tspan></text><path class="seta" d="M875,270 H760"/><text x="1005" y="470" class="nota" text-anchor="middle"><tspan x="1005" dy="0">Disponível não significa</tspan><tspan x="1005" dy="22">representativo</tspan></text>
</svg>
