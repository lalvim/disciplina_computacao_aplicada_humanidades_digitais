<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550"
 role="img" aria-labelledby="titulo descricao">
<title id="titulo">Cadeia de produção das ausências</title>
<desc id="descricao">Da experiência ao campo preenchido, quatro pontos mostram ausência no registro histórico, perda de preservação, ausência na base e valor ausente.</desc>
<defs>
  <marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="3"
   orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#17324d"/>
  </marker>
  <style>
    .titulo { font: 700 30px system-ui, sans-serif; fill: #17324d; }
    .subtitulo { font: 700 19px system-ui, sans-serif; fill: #17324d; }
    .corpo { font: 16px system-ui, sans-serif; fill: #17324d; }
    .nota { font: italic 15px system-ui, sans-serif; fill: #53606c; }
    .numero { font: 700 25px system-ui, sans-serif; fill: #fff; }
    .seta { stroke: #17324d; stroke-width: 3; fill: none; marker-end: url(#seta); }
    .tracejada { stroke-dasharray: 9 7; }
  </style>
</defs>
<rect width="1200" height="550" rx="28" fill="#fbf4e8"/>
<text x="600" y="46" class="titulo" text-anchor="middle"><tspan x="600" dy="0">Ausências surgem em momentos diferentes</tspan></text><rect x="30" y="100" width="190" height="125" rx="18" fill="#dbe8ec" stroke="#17324d" stroke-width="3"/><text x="125.0" y="132" class="subtitulo" text-anchor="middle"><tspan x="125.0" dy="0">Experiência</tspan></text><text x="125.0" y="165" class="corpo" text-anchor="middle"><tspan x="125.0" dy="0">pessoas, práticas</tspan><tspan x="125.0" dy="22">e acontecimentos</tspan></text><path class="seta" d="M223,162 H255"/><rect x="268" y="100" width="190" height="125" rx="18" fill="#d8ebe7" stroke="#256b6b" stroke-width="3"/><text x="363.0" y="132" class="subtitulo" text-anchor="middle"><tspan x="363.0" dy="0">Registro</tspan></text><text x="363.0" y="165" class="corpo" text-anchor="middle"><tspan x="363.0" dy="0">algo é</tspan><tspan x="363.0" dy="22">documentado</tspan></text><path class="seta" d="M461,162 H493"/><rect x="506" y="100" width="190" height="125" rx="18" fill="#f2ddd2" stroke="#a44f32" stroke-width="3"/><text x="601.0" y="132" class="subtitulo" text-anchor="middle"><tspan x="601.0" dy="0">Preservação</tspan></text><text x="601.0" y="165" class="corpo" text-anchor="middle"><tspan x="601.0" dy="0">algo sobrevive</tspan><tspan x="601.0" dy="22">e é localizado</tspan></text><path class="seta" d="M699,162 H731"/><rect x="744" y="100" width="190" height="125" rx="18" fill="#eadde7" stroke="#69445f" stroke-width="3"/><text x="839.0" y="132" class="subtitulo" text-anchor="middle"><tspan x="839.0" dy="0">Base</tspan></text><text x="839.0" y="165" class="corpo" text-anchor="middle"><tspan x="839.0" dy="0">algo é</tspan><tspan x="839.0" dy="22">selecionado</tspan></text><path class="seta" d="M937,162 H969"/><rect x="982" y="100" width="190" height="125" rx="18" fill="#f1e2bd" stroke="#d8b26e" stroke-width="3"/><text x="1077.0" y="132" class="subtitulo" text-anchor="middle"><tspan x="1077.0" dy="0">Campo</tspan></text><text x="1077.0" y="165" class="corpo" text-anchor="middle"><tspan x="1077.0" dy="0">um valor é</tspan><tspan x="1077.0" dy="22">preenchido</tspan></text><path d="M250,230 V285" stroke="#a44f32" stroke-width="3" stroke-dasharray="6 5"/><circle cx="250" cy="305" r="18" fill="#a44f32"/><text x="250" y="350" class="subtitulo" text-anchor="middle"><tspan x="250" dy="0">não registrado</tspan></text><text x="250" y="382" class="corpo" text-anchor="middle"><tspan x="250" dy="0">ausência no</tspan><tspan x="250" dy="22">registro histórico</tspan></text><path d="M488,230 V285" stroke="#a44f32" stroke-width="3" stroke-dasharray="6 5"/><circle cx="488" cy="305" r="18" fill="#a44f32"/><text x="488" y="350" class="subtitulo" text-anchor="middle"><tspan x="488" dy="0">não preservado</tspan></text><text x="488" y="382" class="corpo" text-anchor="middle"><tspan x="488" dy="0">silêncio de preservação</tspan><tspan x="488" dy="22">ou localização</tspan></text><path d="M726,230 V285" stroke="#a44f32" stroke-width="3" stroke-dasharray="6 5"/><circle cx="726" cy="305" r="18" fill="#a44f32"/><text x="726" y="350" class="subtitulo" text-anchor="middle"><tspan x="726" dy="0">não incluído</tspan></text><text x="726" y="382" class="corpo" text-anchor="middle"><tspan x="726" dy="0">ausência</tspan><tspan x="726" dy="22">na base</tspan></text><path d="M964,230 V285" stroke="#a44f32" stroke-width="3" stroke-dasharray="6 5"/><circle cx="964" cy="305" r="18" fill="#a44f32"/><text x="964" y="350" class="subtitulo" text-anchor="middle"><tspan x="964" dy="0">não informado</tspan></text><text x="964" y="382" class="corpo" text-anchor="middle"><tspan x="964" dy="0">valor ausente</tspan><tspan x="964" dy="22">no registro</tspan></text><text x="600" y="490" class="nota" text-anchor="middle"><tspan x="600" dy="0">Aumentar a coleta pode reduzir lacunas da base, mas não recria experiências nunca registradas</tspan></text>
</svg>
