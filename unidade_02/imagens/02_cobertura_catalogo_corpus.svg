<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590"
 role="img" aria-labelledby="titulo descricao">
<title id="titulo">Cobertura do catálogo e do corpus</title>
<desc id="descricao">Barras comparam seis grupos no catálogo e no corpus. Família proprietária cai de dois para zero; trabalhadores de dois para um; público leitor de cinco para quatro.</desc>
<defs>
  <marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="3"
   orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#17324d"/>
  </marker>
  <style>
    .titulo { font: 700 30px system-ui, sans-serif; fill: #17324d; }
    .subtitulo { font: 700 19px system-ui, sans-serif; fill: #17324d; }
    .corpo { font: 16px system-ui, sans-serif; fill: #17324d; }
    .nota { font: italic 15px system-ui, sans-serif; fill: #53606c; }
    .numero { font: 700 25px system-ui, sans-serif; fill: #fff; }
    .seta { stroke: #17324d; stroke-width: 3; fill: none; marker-end: url(#seta); }
    .tracejada { stroke-dasharray: 9 7; }
  </style>
</defs>
<rect width="1200" height="590" rx="28" fill="#fbf4e8"/>
<text x="600" y="44" class="titulo" text-anchor="middle"><tspan x="600" dy="0">Cobertura antes e depois dos critérios</tspan></text><rect x="760" y="70" width="18" height="18" fill="#17324d"/><text x="788" y="85" class="corpo">catálogo</text><rect x="900" y="70" width="18" height="18" fill="#a44f32"/><text x="928" y="85" class="corpo">corpus</text><text x="275" y="145" class="corpo" text-anchor="end"><tspan x="275" dy="0">elite administrativa</tspan></text><rect x="300" y="125" width="300.0" height="20" rx="5" fill="#17324d"/><text x="610.0" y="141" class="corpo">3</text><rect x="300" y="151" width="200.0" height="20" rx="5" fill="#a44f32"/><text x="510.0" y="167" class="corpo">2</text><text x="275" y="211" class="corpo" text-anchor="end"><tspan x="275" dy="0">trabalhadores</tspan></text><rect x="300" y="191" width="200.0" height="20" rx="5" fill="#17324d"/><text x="510.0" y="207" class="corpo">2</text><rect x="300" y="217" width="100.0" height="20" rx="5" fill="#a44f32"/><text x="410.0" y="233" class="corpo">1</text><text x="275" y="277" class="corpo" text-anchor="end"><tspan x="275" dy="0">associação comunitária</tspan></text><rect x="300" y="257" width="200.0" height="20" rx="5" fill="#17324d"/><text x="510.0" y="273" class="corpo">2</text><rect x="300" y="283" width="100.0" height="20" rx="5" fill="#a44f32"/><text x="410.0" y="299" class="corpo">1</text><text x="275" y="343" class="corpo" text-anchor="end"><tspan x="275" dy="0">mulheres associadas</tspan></text><rect x="300" y="323" width="200.0" height="20" rx="5" fill="#17324d"/><text x="510.0" y="339" class="corpo">2</text><rect x="300" y="349" width="100.0" height="20" rx="5" fill="#a44f32"/><text x="410.0" y="365" class="corpo">1</text><text x="275" y="409" class="corpo" text-anchor="end"><tspan x="275" dy="0">público leitor</tspan></text><rect x="300" y="389" width="500.0" height="20" rx="5" fill="#17324d"/><text x="810.0" y="405" class="corpo">5</text><rect x="300" y="415" width="400.0" height="20" rx="5" fill="#a44f32"/><text x="710.0" y="431" class="corpo">4</text><text x="275" y="475" class="corpo" text-anchor="end"><tspan x="275" dy="0">família proprietária</tspan></text><rect x="300" y="455" width="200.0" height="20" rx="5" fill="#17324d"/><text x="510.0" y="471" class="corpo">2</text><rect x="300" y="481" width="0.0" height="20" rx="5" fill="#a44f32"/><text x="310.0" y="497" class="corpo">0</text><text x="600" y="545" class="nota" text-anchor="middle"><tspan x="600" dy="0">As barras descrevem este catálogo fictício; não medem importância ou presença histórica</tspan></text>
</svg>
