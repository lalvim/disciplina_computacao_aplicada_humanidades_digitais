<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 670"
 role="img" aria-labelledby="titulo descricao">
<title id="titulo">Mapa integrado do protocolo da base</title>
<desc id="descricao">Sete componentes — pergunta, fontes, seleção, cobertura, documentação, responsabilidade e viabilidade — convergem para um protocolo defensável e retornam à revisão.</desc>
<defs>
  <marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="3"
   orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#17324d"/>
  </marker>
  <style>
    .titulo { font: 700 30px system-ui, sans-serif; fill: #17324d; }
    .subtitulo { font: 700 19px system-ui, sans-serif; fill: #17324d; }
    .corpo { font: 16px system-ui, sans-serif; fill: #17324d; }
    .nota { font: italic 15px system-ui, sans-serif; fill: #53606c; }
    .numero { font: 700 25px system-ui, sans-serif; fill: #fff; }
    .seta { stroke: #17324d; stroke-width: 3; fill: none; marker-end: url(#seta); }
    .tracejada { stroke-dasharray: 9 7; }
  </style>
</defs>
<rect width="1200" height="670" rx="28" fill="#fbf4e8"/>
<text x="600" y="45" class="titulo" text-anchor="middle"><tspan x="600" dy="0">As partes do protocolo precisam concordar</tspan></text><rect x="80" y="105" width="215" height="125" rx="18" fill="#dbe8ec" stroke="#17324d" stroke-width="3"/><text x="187.5" y="137" class="subtitulo" text-anchor="middle"><tspan x="187.5" dy="0">1. Pergunta</tspan></text><text x="187.5" y="170" class="corpo" text-anchor="middle"><tspan x="187.5" dy="0">alcance e</tspan><tspan x="187.5" dy="22">unidade</tspan></text><rect x="355" y="105" width="215" height="125" rx="18" fill="#d8ebe7" stroke="#256b6b" stroke-width="3"/><text x="462.5" y="137" class="subtitulo" text-anchor="middle"><tspan x="462.5" dy="0">2. Fontes</tspan></text><text x="462.5" y="170" class="corpo" text-anchor="middle"><tspan x="462.5" dy="0">produção e</tspan><tspan x="462.5" dy="22">custódia</tspan></text><rect x="630" y="105" width="215" height="125" rx="18" fill="#f2ddd2" stroke="#a44f32" stroke-width="3"/><text x="737.5" y="137" class="subtitulo" text-anchor="middle"><tspan x="737.5" dy="0">3. Seleção</tspan></text><text x="737.5" y="170" class="corpo" text-anchor="middle"><tspan x="737.5" dy="0">regras e</tspan><tspan x="737.5" dy="22">exclusões</tspan></text><rect x="905" y="105" width="215" height="125" rx="18" fill="#eadde7" stroke="#69445f" stroke-width="3"/><text x="1012.5" y="137" class="subtitulo" text-anchor="middle"><tspan x="1012.5" dy="0">4. Cobertura</tspan></text><text x="1012.5" y="170" class="corpo" text-anchor="middle"><tspan x="1012.5" dy="0">lacunas e</tspan><tspan x="1012.5" dy="22">vieses</tspan></text><rect x="220" y="330" width="215" height="125" rx="18" fill="#dbe8ec" stroke="#17324d" stroke-width="3"/><text x="327.5" y="362" class="subtitulo" text-anchor="middle"><tspan x="327.5" dy="0">5. Documentação</tspan></text><text x="327.5" y="395" class="corpo" text-anchor="middle"><tspan x="327.5" dy="0">metadados e</tspan><tspan x="327.5" dy="22">proveniência</tspan></text><rect x="500" y="330" width="215" height="125" rx="18" fill="#f2ddd2" stroke="#a44f32" stroke-width="3"/><text x="607.5" y="362" class="subtitulo" text-anchor="middle"><tspan x="607.5" dy="0">6. Ética</tspan></text><text x="607.5" y="395" class="corpo" text-anchor="middle"><tspan x="607.5" dy="0">responsabilidade</tspan><tspan x="607.5" dy="22">e legalidade</tspan></text><rect x="780" y="330" width="215" height="125" rx="18" fill="#f1e2bd" stroke="#8a6528" stroke-width="3"/><text x="887.5" y="362" class="subtitulo" text-anchor="middle"><tspan x="887.5" dy="0">7. Viabilidade</tspan></text><text x="887.5" y="395" class="corpo" text-anchor="middle"><tspan x="887.5" dy="0">piloto e</tspan><tspan x="887.5" dy="22">contingência</tspan></text><path class="seta" d="M295,167 L345,167"/><path class="seta" d="M570,167 L620,167"/><path class="seta" d="M845,167 L895,167"/><path class="seta" d="M1010,235 L890,325"/><path class="seta" d="M780,392 L725,392"/><path class="seta" d="M500,392 L445,392"/><rect x="400" y="505" width="400" height="85" rx="18" fill="#fffdf8" stroke="#69445f" stroke-width="3"/><text x="600.0" y="537" class="subtitulo" text-anchor="middle"><tspan x="600.0" dy="0">Protocolo defensável</tspan></text><text x="600.0" y="570" class="corpo" text-anchor="middle"><tspan x="600.0" dy="0">decisões coerentes, rastreáveis e revisáveis</tspan></text><path class="seta" d="M327,458 C330,510 370,540 395,540"/><path class="seta tracejada" d="M400,548 C220,650 70,430 145,235"/><text x="190" y="610" class="nota" text-anchor="middle"><tspan x="190" dy="0">revisão por pares retorna às decisões</tspan></text>
</svg>
