<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exercícios — Unidade 3</title><style>body{font-family:system-ui;max-width:900px;margin:auto;padding:2rem;line-height:1.5;background:#f4f6f7;color:#202528}fieldset{background:white;border:1px solid #9aa7ad;border-radius:8px;margin:1rem 0;padding:1rem}legend{font-weight:700}label{display:block;padding:.35rem}button{padding:.7rem 1rem;font-weight:700}.retorno{margin-top:.6rem;border-left:4px solid #385b66;padding:.5rem;background:#eaf1f3}</style></head><body><h1>Exercícios de revisão — Unidade 3</h1><p>Marque uma alternativa por questão.</p><noscript><p>Use a <a href="exercicios_unidade_03_texto.md">versão textual</a>.</p></noscript><main id="quiz"></main><button id="corrigir">Corrigir</button><p id="resultado" role="status" aria-live="polite"></p><script>const questoes=[{"topico": "Camadas de dados", "enunciado": "Qual prática preserva melhor a auditabilidade?", "alternativas": ["Editar o CSV recebido", "Manter brutos imutáveis e gerar derivados", "Copiar valores manualmente", "Excluir o original após limpar"], "correta": 1, "explicacao": "A separação em camadas permite reconstruir e comparar transformações."}, {"topico": "Estrutura tabular", "enunciado": "Em uma tabela de documentos, cada linha deve representar:", "alternativas": ["uma unidade de análise declarada", "qualquer quantidade de objetos", "uma coluna", "um arquivo obrigatoriamente"], "correta": 0, "explicacao": "A unidade da linha precisa ser coerente e explícita."}, {"topico": "Formatos", "enunciado": "Qual afirmação sobre PDF é correta?", "alternativas": ["Sempre contém texto extraível", "É equivalente a TXT", "Pode conter texto, imagem ou ambos", "É sempre tabular"], "correta": 2, "explicacao": "PDF é um contêiner orientado à página e exige inspeção."}, {"topico": "Formatos", "enunciado": "Ao importar XLSX, é importante registrar:", "alternativas": ["somente o tamanho", "planilha e parâmetros usados", "apenas a cor das células", "nenhuma decisão"], "correta": 1, "explicacao": "Um arquivo pode conter várias planilhas e estruturas."}, {"topico": "Base pública", "enunciado": "Por que manter cópia local com data e proveniência?", "alternativas": ["Porque bases públicas nunca mudam", "Para eliminar a fonte", "Para identificar a versão efetivamente processada", "Para evitar citar o produtor"], "correta": 2, "explicacao": "A cópia e a proveniência fixam o objeto usado no processamento."}, {"topico": "Extração e OCR", "enunciado": "Extração de texto e OCR diferem porque:", "alternativas": ["OCR reconhece caracteres em imagem", "extração sempre corrige erros", "OCR lê apenas CSV", "são operações idênticas"], "correta": 0, "explicacao": "OCR produz uma transcrição a partir de pixels; extração acessa texto já codificado."}, {"topico": "OCR", "enunciado": "Qual procedimento é metodologicamente adequado?", "alternativas": ["Aceitar toda saída", "Avaliar uma amostra contra referência", "Apagar imagens", "Omitir ferramenta e parâmetros"], "correta": 1, "explicacao": "A qualidade deve ser medida e os casos problemáticos revisados."}, {"topico": "Largo e longo", "enunciado": "Ao transformar indicadores largos em longos, muda:", "alternativas": ["a fonte original", "a unidade representada por cada linha", "a licença", "o idioma do texto"], "correta": 1, "explicacao": "A linha passa a representar combinações das dimensões explicitadas."}, {"topico": "Normalização", "enunciado": "Por que preservar o valor original?", "alternativas": ["Para impedir qualquer correção", "Para auditar e eventualmente rever a regra", "Para duplicar sem propósito", "Para dispensar documentação"], "correta": 1, "explicacao": "Original e derivado permitem rastrear perdas e decisões."}, {"topico": "Códigos", "enunciado": "Um código de município deve ser lido preferencialmente como:", "alternativas": ["medida contínua", "identificador textual", "data", "valor monetário"], "correta": 1, "explicacao": "Operações aritméticas não têm sentido para o identificador."}, {"topico": "Datas e ausências", "enunciado": "Converter falhas de data para ausente exige:", "alternativas": ["apagar o original", "guardar original e razão da ausência", "inventar primeiro dia", "excluir a linha"], "correta": 1, "explicacao": "A razão diferencia desconhecimento, erro e inaplicabilidade."}, {"topico": "Duplicatas", "enunciado": "Uma possível duplicata deve:", "alternativas": ["ser apagada automaticamente", "ser tratada como hipótese para revisão", "ser identificada só pelo título", "ser ignorada"], "correta": 1, "explicacao": "Registros semelhantes podem representar objetos distintos."}, {"topico": "Junções", "enunciado": "O argumento validate='many_to_one' testa:", "alternativas": ["a cor da tabela", "a cardinalidade esperada", "a qualidade do OCR", "o encoding"], "correta": 1, "explicacao": "A validação impede aceitar silenciosamente chaves incompatíveis."}, {"topico": "Junções", "enunciado": "O indicador left_only após uma junção significa:", "alternativas": ["registro da esquerda sem correspondência", "duplicata confirmada", "linha vazia", "erro de sintaxe"], "correta": 0, "explicacao": "A não correspondência precisa ser diagnosticada, não descartada."}, {"topico": "Integração", "enunciado": "Como representar vários temas por documento?", "alternativas": ["Sobrescrever o tema", "Tabela relacional documento–tema", "Concatenar sem regra", "Duplicar todos os metadados manualmente"], "correta": 1, "explicacao": "Uma tabela de relações preserva multiplicidade de forma explícita."}, {"topico": "Reprodutibilidade", "enunciado": "Um notebook numerado, sozinho:", "alternativas": ["garante reprodutibilidade total", "não basta sem ambiente, entradas e testes", "elimina proveniência", "substitui dados brutos"], "correta": 1, "explicacao": "Reprodução exige mais que ordem visual."}, {"topico": "Limpeza crítica", "enunciado": "A expressão 'dados limpos' pode ser problemática porque:", "alternativas": ["toda transformação é proibida", "pode ocultar escolhas interpretativas e perdas", "CSV não aceita limpeza", "dados não têm erros"], "correta": 1, "explicacao": "Transformações são necessárias, mas devem ser situadas e auditáveis."}, {"topico": "Integração", "enunciado": "Qual produto está pronto para a Unidade 4?", "alternativas": ["Arquivos sobrescritos sem log", "Base processável com chaves, testes, log e limites", "PDFs sem inventário", "Tabela sem unidade declarada"], "correta": 1, "explicacao": "A exploração depende de uma base reconstruível e documentada."}];const quiz=document.getElementById("quiz");questoes.forEach((q,i)=>{const f=document.createElement("fieldset"),l=document.createElement("legend");l.textContent=`${i+1}. ${q.enunciado}`;f.appendChild(l);q.alternativas.forEach((a,j)=>{const x=document.createElement("label");x.innerHTML=`<input type="radio" name="q${i}" value="${j}"> ${String.fromCharCode(65+j)}. ${a}`;f.appendChild(x)});const r=document.createElement("div");r.className="retorno";r.hidden=true;f.appendChild(r);quiz.appendChild(f)});document.getElementById("corrigir").onclick=()=>{let n=0;[...quiz.children].forEach((f,i)=>{const m=f.querySelector("input:checked"),r=f.querySelector(".retorno"),ok=m&&+m.value===questoes[i].correta;if(ok)n++;r.hidden=false;r.textContent=(ok?"Correto. ":"Resposta: "+String.fromCharCode(65+questoes[i].correta)+". ")+questoes[i].explicacao});document.getElementById("resultado").textContent=`Resultado: ${n} de ${questoes.length}.`};</script></body></html>
