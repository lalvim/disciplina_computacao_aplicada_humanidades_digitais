<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620"
 role="img" aria-labelledby="titulo descricao">
<title id="titulo">Estruturas e possibilidades de ação em CSV, XLSX, JSON e XML</title>
<desc id="descricao">Quatro painéis comparam uma grade tabular CSV, uma pasta XLSX com abas, uma árvore JSON de objetos e listas e uma árvore XML de elementos aninhados. Cada formato exige operações de leitura próprias.</desc>
<defs>
  <marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="3"
   orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#17324d"/>
  </marker>
  <style>
    .titulo { font: 700 30px system-ui, sans-serif; fill: #17324d; }
    .subtitulo { font: 700 19px system-ui, sans-serif; fill: #17324d; }
    .corpo { font: 16px system-ui, sans-serif; fill: #17324d; }
    .pequeno { font: 14px system-ui, sans-serif; fill: #17324d; }
    .nota { font: italic 15px system-ui, sans-serif; fill: #53606c; }
    .numero { font: 700 24px system-ui, sans-serif; fill: #fff; }
    .seta { stroke: #17324d; stroke-width: 3; fill: none; marker-end: url(#seta); }
    .linha { stroke: #17324d; stroke-width: 3; fill: none; }
    .tracejada { stroke-dasharray: 9 7; }
  </style>
</defs>
<rect width="1200" height="620" rx="28" fill="#fbf4e8"/>
<text x="600" y="46" class="titulo" text-anchor="middle"><tspan x="600" dy="0">Quatro formatos, quatro maneiras de organizar informação</tspan></text><rect x="35" y="85" width="260" height="440" rx="20" fill="#dbe8ec" stroke="#17324d" stroke-width="3"/><text x="165" y="125" class="titulo" text-anchor="middle"><tspan x="165" dy="0">CSV</tspan></text><text x="165" y="155" class="nota" text-anchor="middle"><tspan x="165" dy="0">tabela plana</tspan></text><rect x="325" y="85" width="260" height="440" rx="20" fill="#d8ebe7" stroke="#256b6b" stroke-width="3"/><text x="455" y="125" class="titulo" text-anchor="middle"><tspan x="455" dy="0">XLSX</tspan></text><text x="455" y="155" class="nota" text-anchor="middle"><tspan x="455" dy="0">pasta de planilhas</tspan></text><rect x="615" y="85" width="260" height="440" rx="20" fill="#f2ddd2" stroke="#a44f32" stroke-width="3"/><text x="745" y="125" class="titulo" text-anchor="middle"><tspan x="745" dy="0">JSON</tspan></text><text x="745" y="155" class="nota" text-anchor="middle"><tspan x="745" dy="0">objetos e listas</tspan></text><rect x="905" y="85" width="260" height="440" rx="20" fill="#eadde7" stroke="#69445f" stroke-width="3"/><text x="1035" y="125" class="titulo" text-anchor="middle"><tspan x="1035" dy="0">XML</tspan></text><text x="1035" y="155" class="nota" text-anchor="middle"><tspan x="1035" dy="0">elementos aninhados</tspan></text><rect x="72" y="195" width="62" height="38" fill="#c8dce4" stroke="#17324d"/><rect x="134" y="195" width="62" height="38" fill="#c8dce4" stroke="#17324d"/><rect x="196" y="195" width="62" height="38" fill="#c8dce4" stroke="#17324d"/><rect x="72" y="233" width="62" height="38" fill="#fffdf8" stroke="#17324d"/><rect x="134" y="233" width="62" height="38" fill="#fffdf8" stroke="#17324d"/><rect x="196" y="233" width="62" height="38" fill="#fffdf8" stroke="#17324d"/><rect x="72" y="271" width="62" height="38" fill="#fffdf8" stroke="#17324d"/><rect x="134" y="271" width="62" height="38" fill="#fffdf8" stroke="#17324d"/><rect x="196" y="271" width="62" height="38" fill="#fffdf8" stroke="#17324d"/><rect x="72" y="309" width="62" height="38" fill="#fffdf8" stroke="#17324d"/><rect x="134" y="309" width="62" height="38" fill="#fffdf8" stroke="#17324d"/><rect x="196" y="309" width="62" height="38" fill="#fffdf8" stroke="#17324d"/><text x="165" y="385" class="corpo" text-anchor="middle"><tspan x="165" dy="0">linhas + colunas</tspan><tspan x="165" dy="25">separador e encoding</tspan><tspan x="165" dy="25">tipos precisam ser inferidos</tspan></text><rect x="360" y="195" width="190" height="145" rx="6" fill="#fffdf8" stroke="#256b6b" stroke-width="3"/><path d="M360,227 H550" stroke="#256b6b"/><path d="M360,259 H550" stroke="#256b6b"/><path d="M360,291 H550" stroke="#256b6b"/><path d="M407,195 V340" stroke="#256b6b"/><path d="M454,195 V340" stroke="#256b6b"/><path d="M501,195 V340" stroke="#256b6b"/><rect x="370" y="340" width="65" height="22" rx="5" fill="#256b6b"/><rect x="442" y="340" width="65" height="22" rx="5" fill="#94c8bd"/><text x="455" y="402" class="corpo" text-anchor="middle"><tspan x="455" dy="0">várias planilhas</tspan><tspan x="455" dy="25">fórmulas e formatação</tspan><tspan x="455" dy="25">selecionar a aba correta</tspan></text><text x="745" y="205" class="subtitulo" text-anchor="middle"><tspan x="745" dy="0">{ documento }</tspan></text><path class="linha" d="M745,220 V250 M675,250 H815 M675,250 V275 M815,250 V275"/><rect x="642" y="275" width="95" height="68" rx="10" fill="#fffdf8" stroke="#a44f32" stroke-width="3"/><text x="689" y="302" class="subtitulo" text-anchor="middle"><tspan x="689" dy="0">id</tspan></text><text x="689" y="327" class="pequeno" text-anchor="middle"><tspan x="689" dy="0">D001</tspan></text><rect x="753" y="275" width="125" height="68" rx="10" fill="#fffdf8" stroke="#a44f32" stroke-width="3"/><text x="815" y="302" class="subtitulo" text-anchor="middle"><tspan x="815" dy="0">temas</tspan></text><text x="815" y="327" class="pequeno" text-anchor="middle"><tspan x="815" dy="0">[ ... ]</tspan></text><text x="745" y="390" class="corpo" text-anchor="middle"><tspan x="745" dy="0">chaves + valores</tspan><tspan x="745" dy="25">listas e objetos aninhados</tspan><tspan x="745" dy="25">percorrer a hierarquia</tspan></text><text x="1035" y="205" class="subtitulo" text-anchor="middle"><tspan x="1035" dy="0">&lt;documento&gt;</tspan></text><path class="linha" d="M1035,220 V250 M965,250 H1105 M965,250 V275 M1105,250 V275"/><rect x="925" y="275" width="90" height="68" rx="10" fill="#fffdf8" stroke="#69445f" stroke-width="3"/><text x="970" y="302" class="subtitulo" text-anchor="middle"><tspan x="970" dy="0">&lt;id&gt;</tspan></text><text x="970" y="327" class="pequeno" text-anchor="middle"><tspan x="970" dy="0">D001</tspan></text><rect x="1030" y="275" width="140" height="68" rx="10" fill="#fffdf8" stroke="#69445f" stroke-width="3"/><text x="1100" y="302" class="subtitulo" text-anchor="middle"><tspan x="1100" dy="0">&lt;tema&gt;</tspan></text><text x="1100" y="327" class="pequeno" text-anchor="middle"><tspan x="1100" dy="0">educação</tspan></text><text x="1035" y="390" class="corpo" text-anchor="middle"><tspan x="1035" dy="0">elementos + atributos</tspan><tspan x="1035" dy="25">ordem e aninhamento</tspan><tspan x="1035" dy="25">navegar pelas marcas</tspan></text><text x="600" y="580" class="nota" text-anchor="middle"><tspan x="600" dy="0">A extensão sugere um leitor; parâmetros, estrutura esperada e testes confirmam a interpretação</tspan></text>
</svg>
