<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 635"
 role="img" aria-labelledby="titulo descricao">
<title id="titulo">Linha do tempo de formatos de dados</title>
<desc id="descricao">Linha do tempo com HTML em 1990, XML entre 1996 e 1998, JSON e YAML em 2001, documentação do CSV pela RFC 4180 em 2005 e padronização do XLSX em 2006. Uma nota informa que o CSV já era usado antes da RFC.</desc>
<defs>
  <marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="3"
   orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#17324d"/>
  </marker>
  <style>
    .titulo { font: 700 30px system-ui, sans-serif; fill: #17324d; }
    .subtitulo { font: 700 19px system-ui, sans-serif; fill: #17324d; }
    .corpo { font: 16px system-ui, sans-serif; fill: #17324d; }
    .pequeno { font: 14px system-ui, sans-serif; fill: #17324d; }
    .nota { font: italic 15px system-ui, sans-serif; fill: #53606c; }
    .numero { font: 700 24px system-ui, sans-serif; fill: #fff; }
    .seta { stroke: #17324d; stroke-width: 3; fill: none; marker-end: url(#seta); }
    .linha { stroke: #17324d; stroke-width: 3; fill: none; }
    .tracejada { stroke-dasharray: 9 7; }
  </style>
</defs>
<rect width="1200" height="635" rx="28" fill="#fbf4e8"/>
<text x="600" y="43" class="titulo" text-anchor="middle"><tspan x="600" dy="0">Marcos históricos dos formatos de dados</tspan></text><text x="600" y="75" class="nota" text-anchor="middle"><tspan x="600" dy="0">As datas representam tipos diferentes de marco: criação, rascunho, apresentação ou padrão</tspan></text><path class="linha" d="M80,310 H1120"/><circle cx="105" cy="310" r="11" fill="#17324d"/><path class="linha" d="M105,299 V280"/><rect x="23" y="115" width="164" height="165" rx="18" fill="#dbe8ec" stroke="#17324d" stroke-width="3"/><text x="105.0" y="149" class="subtitulo" text-anchor="middle"><tspan x="105.0" dy="0">HTML</tspan></text><text x="105.0" y="184" class="corpo" text-anchor="middle"><tspan x="105.0" dy="0">1990</tspan><tspan x="105.0" dy="22">publicar documentos</tspan><tspan x="105.0" dy="22">ligados na Web</tspan></text><circle cx="300" cy="310" r="11" fill="#256b6b"/><path class="linha" d="M300,321 V345"/><rect x="218" y="355" width="164" height="165" rx="18" fill="#d8ebe7" stroke="#256b6b" stroke-width="3"/><text x="300.0" y="389" class="subtitulo" text-anchor="middle"><tspan x="300.0" dy="0">XML</tspan></text><text x="300.0" y="424" class="corpo" text-anchor="middle"><tspan x="300.0" dy="0">1996 → 1998</tspan><tspan x="300.0" dy="22">estruturar e trocar</tspan><tspan x="300.0" dy="22">informação na Web</tspan></text><circle cx="495" cy="310" r="11" fill="#a44f32"/><path class="linha" d="M495,299 V280"/><rect x="413" y="115" width="164" height="165" rx="18" fill="#f2ddd2" stroke="#a44f32" stroke-width="3"/><text x="495.0" y="149" class="subtitulo" text-anchor="middle"><tspan x="495.0" dy="0">JSON</tspan></text><text x="495.0" y="184" class="corpo" text-anchor="middle"><tspan x="495.0" dy="0">2001</tspan><tspan x="495.0" dy="22">intercâmbio textual</tspan><tspan x="495.0" dy="22">leve e portável</tspan></text><circle cx="690" cy="310" r="11" fill="#69445f"/><path class="linha" d="M690,321 V345"/><rect x="608" y="355" width="164" height="165" rx="18" fill="#eadde7" stroke="#69445f" stroke-width="3"/><text x="690.0" y="389" class="subtitulo" text-anchor="middle"><tspan x="690.0" dy="0">YAML</tspan></text><text x="690.0" y="424" class="corpo" text-anchor="middle"><tspan x="690.0" dy="0">2001</tspan><tspan x="690.0" dy="22">serialização legível</tspan><tspan x="690.0" dy="22">por pessoas</tspan></text><circle cx="885" cy="310" r="11" fill="#8a6528"/><path class="linha" d="M885,299 V280"/><rect x="803" y="115" width="164" height="165" rx="18" fill="#f1e2bd" stroke="#8a6528" stroke-width="3"/><text x="885.0" y="149" class="subtitulo" text-anchor="middle"><tspan x="885.0" dy="0">CSV</tspan></text><text x="885.0" y="184" class="corpo" text-anchor="middle"><tspan x="885.0" dy="0">2005*</tspan><tspan x="885.0" dy="22">documentar a troca</tspan><tspan x="885.0" dy="22">de tabelas planas</tspan></text><circle cx="1080" cy="310" r="11" fill="#17324d"/><path class="linha" d="M1080,321 V345"/><rect x="998" y="355" width="164" height="165" rx="18" fill="#dbe8ec" stroke="#17324d" stroke-width="3"/><text x="1080.0" y="389" class="subtitulo" text-anchor="middle"><tspan x="1080.0" dy="0">XLSX</tspan></text><text x="1080.0" y="424" class="corpo" text-anchor="middle"><tspan x="1080.0" dy="0">2006</tspan><tspan x="1080.0" dy="22">representar e empacotar</tspan><tspan x="1080.0" dy="22">planilhas Office</tspan></text><text x="600" y="565" class="nota" text-anchor="middle"><tspan x="600" dy="0">* A RFC 4180 registrou uma prática CSV anterior; não corresponde à criação do formato</tspan></text><text x="600" y="598" class="nota" text-anchor="middle"><tspan x="600" dy="0">Uma história de formatos é uma história de problemas, usos e processos de padronização</tspan></text>
</svg>
