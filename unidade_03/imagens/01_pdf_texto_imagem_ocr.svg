<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630"
 role="img" aria-labelledby="titulo descricao">
<title id="titulo">Decisão entre extração textual e OCR</title>
<desc id="descricao">Um PDF passa por diagnóstico de texto selecionável. A presença de texto leva à extração da camada; a ausência leva ao OCR. Ambas as rotas terminam em avaliação contra a página.</desc>
<defs>
  <marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="3"
   orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#17324d"/>
  </marker>
  <style>
    .titulo { font: 700 30px system-ui, sans-serif; fill: #17324d; }
    .subtitulo { font: 700 19px system-ui, sans-serif; fill: #17324d; }
    .corpo { font: 16px system-ui, sans-serif; fill: #17324d; }
    .pequeno { font: 14px system-ui, sans-serif; fill: #17324d; }
    .nota { font: italic 15px system-ui, sans-serif; fill: #53606c; }
    .numero { font: 700 24px system-ui, sans-serif; fill: #fff; }
    .seta { stroke: #17324d; stroke-width: 3; fill: none; marker-end: url(#seta); }
    .linha { stroke: #17324d; stroke-width: 3; fill: none; }
    .tracejada { stroke-dasharray: 9 7; }
  </style>
</defs>
<rect width="1200" height="630" rx="28" fill="#fbf4e8"/>
<text x="600" y="46" class="titulo" text-anchor="middle"><tspan x="600" dy="0">PDF: primeiro diagnosticar, depois escolher a operação</tspan></text><rect x="55" y="205" width="205" height="120" rx="18" fill="#fffdf8" stroke="#d8b26e" stroke-width="3"/><text x="157.5" y="239" class="subtitulo" text-anchor="middle"><tspan x="157.5" dy="0">Arquivo PDF</tspan></text><text x="157.5" y="274" class="corpo" text-anchor="middle"><tspan x="157.5" dy="0">contêiner de</tspan><tspan x="157.5" dy="22">páginas</tspan></text><rect x="355" y="180" width="255" height="170" rx="18" fill="#dbe8ec" stroke="#17324d" stroke-width="3"/><text x="482.5" y="214" class="subtitulo" text-anchor="middle"><tspan x="482.5" dy="0">Há texto selecionável?</tspan></text><text x="482.5" y="249" class="corpo" text-anchor="middle"><tspan x="482.5" dy="0">teste de extração</tspan><tspan x="482.5" dy="22">+ inspeção da página</tspan></text><path class="seta" d="M263,265 H345"/><rect x="720" y="90" width="360" height="125" rx="18" fill="#d8ebe7" stroke="#256b6b" stroke-width="3"/><text x="900.0" y="124" class="subtitulo" text-anchor="middle"><tspan x="900.0" dy="0">Sim: extrair a camada textual</tspan></text><text x="900.0" y="159" class="corpo" text-anchor="middle"><tspan x="900.0" dy="0">avaliar ordem, hifenização</tspan><tspan x="900.0" dy="22">e caracteres</tspan></text><rect x="720" y="315" width="360" height="125" rx="18" fill="#f2ddd2" stroke="#a44f32" stroke-width="3"/><text x="900.0" y="349" class="subtitulo" text-anchor="middle"><tspan x="900.0" dy="0">Não: reconhecer a imagem com OCR</tspan></text><text x="900.0" y="384" class="corpo" text-anchor="middle"><tspan x="900.0" dy="0">registrar imagem, ferramenta</tspan><tspan x="900.0" dy="22">parâmetros e idioma</tspan></text><path class="seta" d="M612,220 C660,220 670,155 710,155"/><path class="seta" d="M612,310 C660,310 670,377 710,377"/><text x="655" y="180" class="pequeno" text-anchor="middle"><tspan x="655" dy="0">SIM</tspan></text><text x="655" y="356" class="pequeno" text-anchor="middle"><tspan x="655" dy="0">NÃO</tspan></text><rect x="420" y="490" width="360" height="90" rx="18" fill="#eadde7" stroke="#69445f" stroke-width="3"/><text x="600.0" y="524" class="subtitulo" text-anchor="middle"><tspan x="600.0" dy="0">Avaliar contra a página</tspan></text><text x="600.0" y="559" class="corpo" text-anchor="middle"><tspan x="600.0" dy="0">amostra de referência + métrica</tspan><tspan x="600.0" dy="22">+ leitura humana situada</tspan></text><path class="seta" d="M900,220 C900,475 790,525 790,525"/><path class="seta" d="M900,445 C900,500 830,525 790,525"/>
</svg>
