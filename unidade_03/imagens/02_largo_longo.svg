<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570"
 role="img" aria-labelledby="titulo descricao">
<title id="titulo">Transformação de tabela larga em longa</title>
<desc id="descricao">À esquerda, cada linha representa um documento e tema e período aparecem nas colunas. À direita, cada linha representa uma combinação entre documento, tema e período.</desc>
<defs>
  <marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="3"
   orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#17324d"/>
  </marker>
  <style>
    .titulo { font: 700 30px system-ui, sans-serif; fill: #17324d; }
    .subtitulo { font: 700 19px system-ui, sans-serif; fill: #17324d; }
    .corpo { font: 16px system-ui, sans-serif; fill: #17324d; }
    .pequeno { font: 14px system-ui, sans-serif; fill: #17324d; }
    .nota { font: italic 15px system-ui, sans-serif; fill: #53606c; }
    .numero { font: 700 24px system-ui, sans-serif; fill: #fff; }
    .seta { stroke: #17324d; stroke-width: 3; fill: none; marker-end: url(#seta); }
    .linha { stroke: #17324d; stroke-width: 3; fill: none; }
    .tracejada { stroke-dasharray: 9 7; }
  </style>
</defs>
<rect width="1200" height="570" rx="28" fill="#fbf4e8"/>
<text x="600" y="45" class="titulo" text-anchor="middle"><tspan x="600" dy="0">Largo e longo mudam a unidade da linha</tspan></text><rect x="45" y="105" width="430" height="285" rx="18" fill="#dbe8ec" stroke="#17324d" stroke-width="3"/><text x="260.0" y="139" class="subtitulo" text-anchor="middle"><tspan x="260.0" dy="0">Tabela larga</tspan></text><text x="260.0" y="174" class="corpo" text-anchor="middle"><tspan x="260.0" dy="0">uma linha = um documento</tspan><tspan x="260.0" dy="22">tema e período nas colunas</tspan></text><rect x="70" y="230" width="95" height="42" fill="#fffdf8" stroke="#17324d"/><text x="117" y="255" class="pequeno" text-anchor="middle"><tspan x="117" dy="0">ID</tspan></text><rect x="165" y="230" width="95" height="42" fill="#fffdf8" stroke="#17324d"/><text x="212" y="255" class="pequeno" text-anchor="middle"><tspan x="212" dy="0">educação 1890</tspan></text><rect x="260" y="230" width="95" height="42" fill="#fffdf8" stroke="#17324d"/><text x="307" y="255" class="pequeno" text-anchor="middle"><tspan x="307" dy="0">trabalho 1890</tspan></text><rect x="355" y="230" width="95" height="42" fill="#fffdf8" stroke="#17324d"/><text x="402" y="255" class="pequeno" text-anchor="middle"><tspan x="402" dy="0">educação 1900</tspan></text><rect x="70" y="272" width="95" height="42" fill="#fffdf8" stroke="#17324d"/><text x="117" y="298" class="pequeno" text-anchor="middle"><tspan x="117" dy="0">D001</tspan></text><rect x="165" y="272" width="95" height="42" fill="#fffdf8" stroke="#17324d"/><text x="212" y="298" class="pequeno" text-anchor="middle"><tspan x="212" dy="0">3</tspan></text><rect x="260" y="272" width="95" height="42" fill="#fffdf8" stroke="#17324d"/><text x="307" y="298" class="pequeno" text-anchor="middle"><tspan x="307" dy="0">1</tspan></text><rect x="355" y="272" width="95" height="42" fill="#fffdf8" stroke="#17324d"/><text x="402" y="298" class="pequeno" text-anchor="middle"><tspan x="402" dy="0">2</tspan></text><rect x="70" y="314" width="95" height="42" fill="#fffdf8" stroke="#17324d"/><text x="117" y="340" class="pequeno" text-anchor="middle"><tspan x="117" dy="0">D002</tspan></text><rect x="165" y="314" width="95" height="42" fill="#fffdf8" stroke="#17324d"/><text x="212" y="340" class="pequeno" text-anchor="middle"><tspan x="212" dy="0">0</tspan></text><rect x="260" y="314" width="95" height="42" fill="#fffdf8" stroke="#17324d"/><text x="307" y="340" class="pequeno" text-anchor="middle"><tspan x="307" dy="0">4</tspan></text><rect x="355" y="314" width="95" height="42" fill="#fffdf8" stroke="#17324d"/><text x="402" y="340" class="pequeno" text-anchor="middle"><tspan x="402" dy="0">1</tspan></text><path class="seta" d="M485,250 H705"/><text x="595" y="220" class="subtitulo" text-anchor="middle"><tspan x="595" dy="0">reorganizar</tspan></text><text x="595" y="285" class="nota" text-anchor="middle"><tspan x="595" dy="0">não é resumir</tspan></text><rect x="725" y="105" width="430" height="350" rx="18" fill="#d8ebe7" stroke="#256b6b" stroke-width="3"/><text x="940.0" y="139" class="subtitulo" text-anchor="middle"><tspan x="940.0" dy="0">Tabela longa</tspan></text><text x="940.0" y="174" class="corpo" text-anchor="middle"><tspan x="940.0" dy="0">uma linha = documento–tema–período</tspan><tspan x="940.0" dy="22">dimensões passam a valores</tspan></text><rect x="750" y="230" width="95" height="42" fill="#fffdf8" stroke="#256b6b"/><text x="797" y="255" class="pequeno" text-anchor="middle"><tspan x="797" dy="0">ID</tspan></text><rect x="845" y="230" width="95" height="42" fill="#fffdf8" stroke="#256b6b"/><text x="892" y="255" class="pequeno" text-anchor="middle"><tspan x="892" dy="0">tema</tspan></text><rect x="940" y="230" width="95" height="42" fill="#fffdf8" stroke="#256b6b"/><text x="987" y="255" class="pequeno" text-anchor="middle"><tspan x="987" dy="0">período</tspan></text><rect x="1035" y="230" width="95" height="42" fill="#fffdf8" stroke="#256b6b"/><text x="1082" y="255" class="pequeno" text-anchor="middle"><tspan x="1082" dy="0">ocorrências</tspan></text><rect x="750" y="272" width="95" height="42" fill="#fffdf8" stroke="#256b6b"/><text x="797" y="298" class="pequeno" text-anchor="middle"><tspan x="797" dy="0">D001</tspan></text><rect x="845" y="272" width="95" height="42" fill="#fffdf8" stroke="#256b6b"/><text x="892" y="298" class="pequeno" text-anchor="middle"><tspan x="892" dy="0">educação</tspan></text><rect x="940" y="272" width="95" height="42" fill="#fffdf8" stroke="#256b6b"/><text x="987" y="298" class="pequeno" text-anchor="middle"><tspan x="987" dy="0">1890</tspan></text><rect x="1035" y="272" width="95" height="42" fill="#fffdf8" stroke="#256b6b"/><text x="1082" y="298" class="pequeno" text-anchor="middle"><tspan x="1082" dy="0">3</tspan></text><rect x="750" y="314" width="95" height="42" fill="#fffdf8" stroke="#256b6b"/><text x="797" y="340" class="pequeno" text-anchor="middle"><tspan x="797" dy="0">D001</tspan></text><rect x="845" y="314" width="95" height="42" fill="#fffdf8" stroke="#256b6b"/><text x="892" y="340" class="pequeno" text-anchor="middle"><tspan x="892" dy="0">trabalho</tspan></text><rect x="940" y="314" width="95" height="42" fill="#fffdf8" stroke="#256b6b"/><text x="987" y="340" class="pequeno" text-anchor="middle"><tspan x="987" dy="0">1890</tspan></text><rect x="1035" y="314" width="95" height="42" fill="#fffdf8" stroke="#256b6b"/><text x="1082" y="340" class="pequeno" text-anchor="middle"><tspan x="1082" dy="0">1</tspan></text><rect x="750" y="356" width="95" height="42" fill="#fffdf8" stroke="#256b6b"/><text x="797" y="382" class="pequeno" text-anchor="middle"><tspan x="797" dy="0">D001</tspan></text><rect x="845" y="356" width="95" height="42" fill="#fffdf8" stroke="#256b6b"/><text x="892" y="382" class="pequeno" text-anchor="middle"><tspan x="892" dy="0">educação</tspan></text><rect x="940" y="356" width="95" height="42" fill="#fffdf8" stroke="#256b6b"/><text x="987" y="382" class="pequeno" text-anchor="middle"><tspan x="987" dy="0">1900</tspan></text><rect x="1035" y="356" width="95" height="42" fill="#fffdf8" stroke="#256b6b"/><text x="1082" y="382" class="pequeno" text-anchor="middle"><tspan x="1082" dy="0">2</tspan></text><text x="600" y="520" class="nota" text-anchor="middle"><tspan x="600" dy="0">A forma correta depende da pergunta e da unidade de análise declarada</tspan></text>
</svg>
