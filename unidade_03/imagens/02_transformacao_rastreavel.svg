<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590"
 role="img" aria-labelledby="titulo descricao">
<title id="titulo">Transformação rastreável de datas</title>
<desc id="descricao">O valor recebido é preservado, uma regra explícita produz representação derivada e registra a precisão da informação. Um log e testes permitem retornar à fonte e revisar a decisão.</desc>
<defs>
  <marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="3"
   orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#17324d"/>
  </marker>
  <style>
    .titulo { font: 700 30px system-ui, sans-serif; fill: #17324d; }
    .subtitulo { font: 700 19px system-ui, sans-serif; fill: #17324d; }
    .corpo { font: 16px system-ui, sans-serif; fill: #17324d; }
    .pequeno { font: 14px system-ui, sans-serif; fill: #17324d; }
    .nota { font: italic 15px system-ui, sans-serif; fill: #53606c; }
    .numero { font: 700 24px system-ui, sans-serif; fill: #fff; }
    .seta { stroke: #17324d; stroke-width: 3; fill: none; marker-end: url(#seta); }
    .linha { stroke: #17324d; stroke-width: 3; fill: none; }
    .tracejada { stroke-dasharray: 9 7; }
  </style>
</defs>
<rect width="1200" height="590" rx="28" fill="#fbf4e8"/>
<text x="600" y="46" class="titulo" text-anchor="middle"><tspan x="600" dy="0">Normalizar sem apagar a evidência</tspan></text><rect x="45" y="140" width="255" height="200" rx="18" fill="#fffdf8" stroke="#d8b26e" stroke-width="3"/><text x="172.5" y="174" class="subtitulo" text-anchor="middle"><tspan x="172.5" dy="0">Valor recebido</tspan></text><text x="172.5" y="209" class="corpo" text-anchor="middle"><tspan x="172.5" dy="0">data_documento</tspan><tspan x="172.5" dy="22">06/02/1891</tspan><tspan x="172.5" dy="22">ou apenas 1892</tspan></text><rect x="380" y="140" width="360" height="200" rx="18" fill="#dbe8ec" stroke="#17324d" stroke-width="3"/><text x="560.0" y="174" class="subtitulo" text-anchor="middle"><tspan x="560.0" dy="0">Regra explícita</tspan></text><text x="560.0" y="209" class="corpo" text-anchor="middle"><tspan x="560.0" dy="0">identificar o padrão</tspan><tspan x="560.0" dy="22">aplicar parser compatível</tspan><tspan x="560.0" dy="22">não completar partes ausentes</tspan></text><rect x="820" y="105" width="330" height="130" rx="18" fill="#d8ebe7" stroke="#256b6b" stroke-width="3"/><text x="985.0" y="139" class="subtitulo" text-anchor="middle"><tspan x="985.0" dy="0">Representação derivada</tspan></text><text x="985.0" y="174" class="corpo" text-anchor="middle"><tspan x="985.0" dy="0">data normalizada</tspan><tspan x="985.0" dy="22">ou ano conhecido</tspan></text><rect x="820" y="285" width="330" height="130" rx="18" fill="#f2ddd2" stroke="#a44f32" stroke-width="3"/><text x="985.0" y="319" class="subtitulo" text-anchor="middle"><tspan x="985.0" dy="0">Estado da informação</tspan></text><text x="985.0" y="354" class="corpo" text-anchor="middle"><tspan x="985.0" dy="0">precisão: dia, ano</tspan><tspan x="985.0" dy="22">ou desconhecida</tspan></text><path class="seta" d="M303,240 H370"/><path class="seta" d="M743,210 C780,210 785,170 810,170"/><path class="seta" d="M743,270 C780,270 785,350 810,350"/><rect x="385" y="440" width="430" height="95" rx="18" fill="#eadde7" stroke="#69445f" stroke-width="3"/><text x="600.0" y="474" class="subtitulo" text-anchor="middle"><tspan x="600.0" dy="0">Log + teste</tspan></text><text x="600.0" y="509" class="corpo" text-anchor="middle"><tspan x="600.0" dy="0">regra, casos afetados, falhas</tspan><tspan x="600.0" dy="22">reversibilidade e responsável</tspan></text><path class="seta tracejada" d="M985,420 C985,505 830,490 825,490"/><path class="seta tracejada" d="M375,490 C225,490 175,425 175,350"/>
</svg>
