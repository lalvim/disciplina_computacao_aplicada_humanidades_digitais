<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600"
 role="img" aria-labelledby="titulo descricao">
<title id="titulo">Cardinalidades um para um, um para muitos e muitos para muitos</title>
<desc id="descricao">Três painéis representam relações um para um, um para muitos e muitos para muitos. A legenda ressalta que a cardinalidade deve ser declarada e testada antes da junção.</desc>
<defs>
  <marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="3"
   orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#17324d"/>
  </marker>
  <style>
    .titulo { font: 700 30px system-ui, sans-serif; fill: #17324d; }
    .subtitulo { font: 700 19px system-ui, sans-serif; fill: #17324d; }
    .corpo { font: 16px system-ui, sans-serif; fill: #17324d; }
    .pequeno { font: 14px system-ui, sans-serif; fill: #17324d; }
    .nota { font: italic 15px system-ui, sans-serif; fill: #53606c; }
    .numero { font: 700 24px system-ui, sans-serif; fill: #fff; }
    .seta { stroke: #17324d; stroke-width: 3; fill: none; marker-end: url(#seta); }
    .linha { stroke: #17324d; stroke-width: 3; fill: none; }
    .tracejada { stroke-dasharray: 9 7; }
  </style>
</defs>
<rect width="1200" height="600" rx="28" fill="#fbf4e8"/>
<text x="600" y="45" class="titulo" text-anchor="middle"><tspan x="600" dy="0">Cardinalidade é uma hipótese sobre as relações</tspan></text><rect x="40" y="90" width="360" height="405" rx="22" fill="#dbe8ec" stroke="#17324d" stroke-width="3"/><text x="220" y="132" class="titulo" text-anchor="middle"><tspan x="220" dy="0">1 : 1</tspan></text><text x="220" y="168" class="corpo" text-anchor="middle"><tspan x="220" dy="0">documento ↔ texto</tspan></text><circle cx="125" cy="290" r="20" fill="#fffdf8" stroke="#17324d" stroke-width="3"/><circle cx="315" cy="290" r="20" fill="#fffdf8" stroke="#17324d" stroke-width="3"/><path d="M146,290 L294,290" stroke="#17324d" stroke-width="2"/><rect x="420" y="90" width="360" height="405" rx="22" fill="#d8ebe7" stroke="#256b6b" stroke-width="3"/><text x="600" y="132" class="titulo" text-anchor="middle"><tspan x="600" dy="0">1 : N</tspan></text><text x="600" y="168" class="corpo" text-anchor="middle"><tspan x="600" dy="0">documento ↔ temas</tspan></text><circle cx="505" cy="290" r="20" fill="#fffdf8" stroke="#256b6b" stroke-width="3"/><circle cx="695" cy="235" r="20" fill="#fffdf8" stroke="#256b6b" stroke-width="3"/><circle cx="695" cy="290" r="20" fill="#fffdf8" stroke="#256b6b" stroke-width="3"/><circle cx="695" cy="345" r="20" fill="#fffdf8" stroke="#256b6b" stroke-width="3"/><path d="M526,290 L674,235" stroke="#256b6b" stroke-width="2"/><path d="M526,290 L674,290" stroke="#256b6b" stroke-width="2"/><path d="M526,290 L674,345" stroke="#256b6b" stroke-width="2"/><rect x="800" y="90" width="360" height="405" rx="22" fill="#f2ddd2" stroke="#a44f32" stroke-width="3"/><text x="980" y="132" class="titulo" text-anchor="middle"><tspan x="980" dy="0">N : N</tspan></text><text x="980" y="168" class="corpo" text-anchor="middle"><tspan x="980" dy="0">documentos ↔ pessoas</tspan></text><circle cx="885" cy="235" r="20" fill="#fffdf8" stroke="#a44f32" stroke-width="3"/><circle cx="885" cy="290" r="20" fill="#fffdf8" stroke="#a44f32" stroke-width="3"/><circle cx="885" cy="345" r="20" fill="#fffdf8" stroke="#a44f32" stroke-width="3"/><circle cx="1075" cy="235" r="20" fill="#fffdf8" stroke="#a44f32" stroke-width="3"/><circle cx="1075" cy="290" r="20" fill="#fffdf8" stroke="#a44f32" stroke-width="3"/><circle cx="1075" cy="345" r="20" fill="#fffdf8" stroke="#a44f32" stroke-width="3"/><path d="M906,235 L1054,235" stroke="#a44f32" stroke-width="2"/><path d="M906,235 L1054,290" stroke="#a44f32" stroke-width="2"/><path d="M906,235 L1054,345" stroke="#a44f32" stroke-width="2"/><path d="M906,290 L1054,235" stroke="#a44f32" stroke-width="2"/><path d="M906,290 L1054,290" stroke="#a44f32" stroke-width="2"/><path d="M906,290 L1054,345" stroke="#a44f32" stroke-width="2"/><path d="M906,345 L1054,235" stroke="#a44f32" stroke-width="2"/><path d="M906,345 L1054,290" stroke="#a44f32" stroke-width="2"/><path d="M906,345 L1054,345" stroke="#a44f32" stroke-width="2"/><text x="600" y="555" class="nota" text-anchor="middle"><tspan x="600" dy="0">Declarar e testar a cardinalidade evita multiplicar linhas silenciosamente</tspan></text>
</svg>
