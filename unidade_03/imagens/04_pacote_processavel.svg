<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 585"
 role="img" aria-labelledby="titulo descricao">
<title id="titulo">Componentes de uma base processável</title>
<desc id="descricao">Dados brutos, código, dados derivados e documentação formam um pacote avaliado por testes e parecer de qualidade. Uma seta de retorno representa correções rastreáveis.</desc>
<defs>
  <marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="3"
   orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#17324d"/>
  </marker>
  <style>
    .titulo { font: 700 30px system-ui, sans-serif; fill: #17324d; }
    .subtitulo { font: 700 19px system-ui, sans-serif; fill: #17324d; }
    .corpo { font: 16px system-ui, sans-serif; fill: #17324d; }
    .pequeno { font: 14px system-ui, sans-serif; fill: #17324d; }
    .nota { font: italic 15px system-ui, sans-serif; fill: #53606c; }
    .numero { font: 700 24px system-ui, sans-serif; fill: #fff; }
    .seta { stroke: #17324d; stroke-width: 3; fill: none; marker-end: url(#seta); }
    .linha { stroke: #17324d; stroke-width: 3; fill: none; }
    .tracejada { stroke-dasharray: 9 7; }
  </style>
</defs>
<rect width="1200" height="585" rx="28" fill="#fbf4e8"/>
<text x="600" y="45" class="titulo" text-anchor="middle"><tspan x="600" dy="0">A entrega é um pacote auditável, não apenas um CSV</tspan></text><rect x="55" y="110" width="250" height="155" rx="18" fill="#dbe8ec" stroke="#17324d" stroke-width="3"/><text x="180.0" y="144" class="subtitulo" text-anchor="middle"><tspan x="180.0" dy="0">Dados brutos</tspan></text><text x="180.0" y="179" class="corpo" text-anchor="middle"><tspan x="180.0" dy="0">preservados</tspan><tspan x="180.0" dy="22">e identificados</tspan></text><rect x="335" y="110" width="250" height="155" rx="18" fill="#d8ebe7" stroke="#256b6b" stroke-width="3"/><text x="460.0" y="144" class="subtitulo" text-anchor="middle"><tspan x="460.0" dy="0">Código</tspan></text><text x="460.0" y="179" class="corpo" text-anchor="middle"><tspan x="460.0" dy="0">ordem executável</tspan><tspan x="460.0" dy="22">e parâmetros</tspan></text><rect x="615" y="110" width="250" height="155" rx="18" fill="#f2ddd2" stroke="#a44f32" stroke-width="3"/><text x="740.0" y="144" class="subtitulo" text-anchor="middle"><tspan x="740.0" dy="0">Dados derivados</tspan></text><text x="740.0" y="179" class="corpo" text-anchor="middle"><tspan x="740.0" dy="0">tabelas ligadas</tspan><tspan x="740.0" dy="22">por chaves</tspan></text><rect x="895" y="110" width="250" height="155" rx="18" fill="#eadde7" stroke="#69445f" stroke-width="3"/><text x="1020.0" y="144" class="subtitulo" text-anchor="middle"><tspan x="1020.0" dy="0">Documentação</tspan></text><text x="1020.0" y="179" class="corpo" text-anchor="middle"><tspan x="1020.0" dy="0">proveniência, log</tspan><tspan x="1020.0" dy="22">e limites</tspan></text><path class="seta" d="M305,188 H325"/><path class="seta" d="M585,188 H605"/><path class="seta" d="M865,188 H885"/><rect x="260" y="355" width="300" height="115" rx="18" fill="#fffdf8" stroke="#d8b26e" stroke-width="3"/><text x="410.0" y="389" class="subtitulo" text-anchor="middle"><tspan x="410.0" dy="0">Testes</tspan></text><text x="410.0" y="424" class="corpo" text-anchor="middle"><tspan x="410.0" dy="0">esquema • chaves • contagens</tspan><tspan x="410.0" dy="22">cobertura • reconstrução</tspan></text><rect x="640" y="355" width="300" height="115" rx="18" fill="#fffdf8" stroke="#a44f32" stroke-width="3"/><text x="790.0" y="389" class="subtitulo" text-anchor="middle"><tspan x="790.0" dy="0">Parecer de qualidade</tspan></text><text x="790.0" y="424" class="corpo" text-anchor="middle"><tspan x="790.0" dy="0">erros conhecidos</tspan><tspan x="790.0" dy="22">casos pendentes • usos possíveis</tspan></text><path class="seta" d="M460,350 C460,305 535,295 560,275"/><path class="seta" d="M790,350 C790,305 730,295 700,275"/><path class="seta tracejada" d="M950,480 C950,560 190,560 190,280"/><text x="600" y="530" class="nota" text-anchor="middle"><tspan x="600" dy="0">Se o pacote não permite reconstruir e explicar a base, a transformação permanece incompleta</tspan></text>
</svg>
