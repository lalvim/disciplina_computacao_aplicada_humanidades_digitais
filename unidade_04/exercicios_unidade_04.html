<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Unidade 4</title><style>body{font-family:system-ui;max-width:900px;margin:auto;padding:2rem}fieldset{margin:1rem;padding:1rem}label{display:block}.r{background:#eef;padding:.5rem}</style></head><body><h1>Exercícios — Unidade 4</h1><noscript><a href="exercicios_unidade_04_texto.md">Versão textual</a></noscript><main id="q"></main><button id="b">Corrigir</button><p id="s" role="status" aria-live="polite"></p><script>const qs=[{"topico": "Variáveis", "enunciado": "Código municipal numérico é:", "alternativas": ["medida contínua", "identificador", "proporção", "variância"], "correta": 1, "explicacao": "A aparência numérica não altera seu papel de identificador."}, {"topico": "Frequências", "enunciado": "Uma proporção exige declarar:", "alternativas": ["a cor", "o denominador", "a moda", "o OCR"], "correta": 1, "explicacao": "Sem denominador, a comparação fica ambígua."}, {"topico": "Centro", "enunciado": "Qual medida é mais sensível a um extremo alto?", "alternativas": ["média", "mediana", "moda", "quartil"], "correta": 0, "explicacao": "A média utiliza todos os valores."}, {"topico": "Dispersão", "enunciado": "O desvio-padrão descreve:", "alternativas": ["categoria modal", "dispersão em torno da média", "causalidade", "tamanho do corpus"], "correta": 1, "explicacao": "Ele retorna à unidade da variável."}, {"topico": "Quartis", "enunciado": "O intervalo interquartil é:", "alternativas": ["Q3 menos Q1", "máximo menos mínimo", "média menos moda", "variância ao quadrado"], "correta": 0, "explicacao": "IQR cobre a metade central ordenada."}, {"topico": "Extremos", "enunciado": "Um caso além de 1,5×IQR deve:", "alternativas": ["ser apagado", "ser inspecionado", "provar erro", "confirmar hipótese"], "correta": 1, "explicacao": "A regra sinaliza, não decide."}, {"topico": "Contingência", "enunciado": "Proporções por linha mostram:", "alternativas": ["composição dentro de cada linha", "causalidade", "média textual", "OCR"], "correta": 0, "explicacao": "O denominador é o total da linha."}, {"topico": "Tokenização", "enunciado": "Tokenizar significa:", "alternativas": ["segmentar segundo regra", "traduzir", "testar hipótese", "remover contexto sem registro"], "correta": 0, "explicacao": "A segmentação depende de convenções."}, {"topico": "Normalização", "enunciado": "Converter tudo em minúsculas pode:", "alternativas": ["preservar toda distinção", "apagar informação de capitalização", "calcular quartis", "criar PDF"], "correta": 1, "explicacao": "Normalização tem perdas possíveis."}, {"topico": "Frequência textual", "enunciado": "Frequência relativa divide por:", "alternativas": ["total de tokens relevante", "número de gráficos", "mediana", "IQR"], "correta": 0, "explicacao": "Ela explicita o denominador textual."}, {"topico": "Concordância", "enunciado": "Concordâncias servem para:", "alternativas": ["recuperar contexto local", "provar associação", "remover extremos", "calcular variância"], "correta": 0, "explicacao": "Janelas ligam agregado a ocorrências."}, {"topico": "N-gramas", "enunciado": "Um bigrama contém:", "alternativas": ["duas unidades adjacentes", "dois quartis", "duas tabelas", "duas hipóteses"], "correta": 0, "explicacao": "N define o tamanho da sequência."}, {"topico": "Colocações", "enunciado": "PMI exige cautela porque:", "alternativas": ["favorece eventos raros", "é sempre causal", "não usa palavras", "mede mediana"], "correta": 0, "explicacao": "Frequência mínima e contexto ajudam."}, {"topico": "Diversidade", "enunciado": "TTR bruta é afetada por:", "alternativas": ["tamanho do texto", "cor do gráfico", "ano apenas", "tipo do PDF"], "correta": 0, "explicacao": "Textos maiores tendem a menor TTR."}, {"topico": "Barras", "enunciado": "Barras são adequadas principalmente para:", "alternativas": ["categorias", "texto integral", "causalidade", "OCR"], "correta": 0, "explicacao": "Comprimento facilita comparar categorias."}, {"topico": "Histograma", "enunciado": "A aparência do histograma depende:", "alternativas": ["dos intervalos", "da moda apenas", "do título apenas", "do ID"], "correta": 0, "explicacao": "Bins condicionam a forma visível."}, {"topico": "Dispersão", "enunciado": "Um padrão de pontos prova causalidade?", "alternativas": ["sim", "não", "apenas com cor", "sempre em HD"], "correta": 1, "explicacao": "Exploração de relação não estabelece causa."}, {"topico": "Relatório", "enunciado": "Uma hipótese exploratória deve ser:", "alternativas": ["provisória e acompanhada de alternativas", "tratada como confirmada", "omitida", "chamada significativa"], "correta": 0, "explicacao": "Ela orienta investigação posterior."}],q=document.getElementById("q");qs.forEach((x,i)=>{let f=document.createElement("fieldset");f.innerHTML=`<legend>${i+1}. ${x.enunciado}</legend>`;x.alternativas.forEach((a,j)=>f.innerHTML+=`<label><input type="radio" name="q${i}" value="${j}">${String.fromCharCode(65+j)}. ${a}</label>`);f.innerHTML+='<div class="r" hidden></div>';q.appendChild(f)});b.onclick=()=>{let n=0;[...q.children].forEach((f,i)=>{let m=f.querySelector('input:checked'),r=f.querySelector('.r'),ok=m&&+m.value===qs[i].correta;if(ok)n++;r.hidden=false;r.textContent=(ok?'Correto. ':'Resposta: '+String.fromCharCode(65+qs[i].correta)+'. ')+qs[i].explicacao});s.textContent=`Resultado: ${n} de 18.`};</script></body></html>
