<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560"
 role="img" aria-labelledby="titulo descricao">
<title id="titulo">Tipos de variáveis e escolhas analíticas</title>
<desc id="descricao">Quatro caixas relacionam escalas nominal, ordinal, quantitativa e temporal a operações e gráficos. Uma quinta caixa alerta que identificadores numéricos não são medidas.</desc>
<defs>
  <marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="3"
   orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#17324d"/>
  </marker>
  <style>
    .titulo { font: 700 30px system-ui, sans-serif; fill: #17324d; }
    .subtitulo { font: 700 19px system-ui, sans-serif; fill: #17324d; }
    .corpo { font: 16px system-ui, sans-serif; fill: #17324d; }
    .pequeno { font: 14px system-ui, sans-serif; fill: #17324d; }
    .nota { font: italic 15px system-ui, sans-serif; fill: #53606c; }
    .seta { stroke: #17324d; stroke-width: 3; fill: none; marker-end: url(#seta); }
    .linha { stroke: #17324d; stroke-width: 3; fill: none; }
    .tracejada { stroke-dasharray: 9 7; }
  </style>
</defs>
<rect width="1200" height="560" rx="28" fill="#fbf4e8"/>
<text x="600" y="44" class="titulo" text-anchor="middle"><tspan x="600" dy="0">A escala conceitual orienta operações e gráficos</tspan></text><rect x="45" y="110" width="240" height="155" rx="18" fill="#dbe8ec" stroke="#17324d" stroke-width="3"/><text x="165.0" y="144" class="subtitulo" text-anchor="middle"><tspan x="165.0" dy="0">Nominal</tspan></text><text x="165.0" y="180" class="corpo" text-anchor="middle"><tspan x="165.0" dy="0">distingue categorias</tspan><tspan x="165.0" dy="22">frequências • barras</tspan></text><rect x="335" y="110" width="240" height="155" rx="18" fill="#d8ebe7" stroke="#256b6b" stroke-width="3"/><text x="455.0" y="144" class="subtitulo" text-anchor="middle"><tspan x="455.0" dy="0">Ordinal</tspan></text><text x="455.0" y="180" class="corpo" text-anchor="middle"><tspan x="455.0" dy="0">categorias ordenadas</tspan><tspan x="455.0" dy="22">posição • barras ordenadas</tspan></text><rect x="625" y="110" width="240" height="155" rx="18" fill="#f2ddd2" stroke="#a44f32" stroke-width="3"/><text x="745.0" y="144" class="subtitulo" text-anchor="middle"><tspan x="745.0" dy="0">Quantitativa</tspan></text><text x="745.0" y="180" class="corpo" text-anchor="middle"><tspan x="745.0" dy="0">conta ou mede</tspan><tspan x="745.0" dy="22">centro • dispersão</tspan></text><rect x="915" y="110" width="240" height="155" rx="18" fill="#eadde7" stroke="#69445f" stroke-width="3"/><text x="1035.0" y="144" class="subtitulo" text-anchor="middle"><tspan x="1035.0" dy="0">Temporal</tspan></text><text x="1035.0" y="180" class="corpo" text-anchor="middle"><tspan x="1035.0" dy="0">ordena no tempo</tspan><tspan x="1035.0" dy="22">pontos • linha cautelosa</tspan></text><rect x="400" y="330" width="400" height="120" rx="18" fill="#fffdf8" stroke="#d8b26e" stroke-width="3"/><text x="600.0" y="364" class="subtitulo" text-anchor="middle"><tspan x="600.0" dy="0">Identificador</tspan></text><text x="600.0" y="400" class="corpo" text-anchor="middle"><tspan x="600.0" dy="0">parece número, mas identifica</tspan><tspan x="600.0" dy="22">não se soma nem se calcula média</tspan></text><text x="600" y="515" class="nota" text-anchor="middle"><tspan x="600" dy="0">O dtype do arquivo não substitui a decisão teórica sobre a variável</tspan></text>
</svg>
