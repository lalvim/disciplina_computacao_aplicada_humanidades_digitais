<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"
 role="img" aria-labelledby="titulo descricao">
<title id="titulo">Hierarquia didática dos tipos de dados</title>
<desc id="descricao">Tipos de dados se dividem em categóricos, numéricos e temporais. Categóricos se dividem em nominal e ordinal; numéricos, em intervalar e razão; temporais, em datas e horários. Notas separam as distinções discreto e contínuo e o papel dos identificadores.</desc>
<defs>
  <marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="3"
   orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#17324d"/>
  </marker>
  <style>
    .titulo { font: 700 30px system-ui, sans-serif; fill: #17324d; }
    .subtitulo { font: 700 19px system-ui, sans-serif; fill: #17324d; }
    .corpo { font: 16px system-ui, sans-serif; fill: #17324d; }
    .pequeno { font: 14px system-ui, sans-serif; fill: #17324d; }
    .nota { font: italic 15px system-ui, sans-serif; fill: #53606c; }
    .seta { stroke: #17324d; stroke-width: 3; fill: none; marker-end: url(#seta); }
    .linha { stroke: #17324d; stroke-width: 3; fill: none; }
    .tracejada { stroke-dasharray: 9 7; }
  </style>
</defs>
<rect width="1200" height="720" rx="28" fill="#fbf4e8"/>
<text x="600" y="40" class="titulo" text-anchor="middle"><tspan x="600" dy="0">Hierarquia didática dos tipos de dados</tspan></text><rect x="450" y="70" width="300" height="80" rx="18" fill="#fffdf8" stroke="#d8b26e" stroke-width="3"/><text x="600.0" y="104" class="subtitulo" text-anchor="middle"><tspan x="600.0" dy="0">Tipos de dados</tspan></text><text x="600.0" y="140" class="corpo" text-anchor="middle"><tspan x="600.0" dy="0">classificar pelo significado</tspan></text><path class="linha" d="M600,150 V185 H215 M600,185 H985"/><path class="linha" d="M215,185 V210"/><path class="linha" d="M600,185 V210"/><path class="linha" d="M985,185 V210"/><rect x="50" y="210" width="330" height="90" rx="18" fill="#dbe8ec" stroke="#17324d" stroke-width="3"/><text x="215.0" y="244" class="subtitulo" text-anchor="middle"><tspan x="215.0" dy="0">Categóricos</tspan></text><text x="215.0" y="280" class="corpo" text-anchor="middle"><tspan x="215.0" dy="0">distinguem grupos</tspan></text><rect x="435" y="210" width="330" height="90" rx="18" fill="#f2ddd2" stroke="#a44f32" stroke-width="3"/><text x="600.0" y="244" class="subtitulo" text-anchor="middle"><tspan x="600.0" dy="0">Numéricos</tspan></text><text x="600.0" y="280" class="corpo" text-anchor="middle"><tspan x="600.0" dy="0">expressam medidas</tspan></text><rect x="820" y="210" width="330" height="90" rx="18" fill="#eadde7" stroke="#69445f" stroke-width="3"/><text x="985.0" y="244" class="subtitulo" text-anchor="middle"><tspan x="985.0" dy="0">Temporais</tspan></text><text x="985.0" y="280" class="corpo" text-anchor="middle"><tspan x="985.0" dy="0">situam no tempo</tspan></text><path class="linha" d="M215,300 V330 H130 M215,330 H310 M130,330 V355 M310,330 V355"/><path class="linha" d="M600,300 V330 H515 M600,330 H695 M515,330 V355 M695,330 V355"/><path class="linha" d="M985,300 V330 H900 M985,330 H1080 M900,330 V355 M1080,330 V355"/><rect x="50" y="355" width="160" height="130" rx="18" fill="#dbe8ec" stroke="#17324d" stroke-width="3"/><text x="130.0" y="389" class="subtitulo" text-anchor="middle"><tspan x="130.0" dy="0">Nominal</tspan></text><text x="130.0" y="425" class="corpo" text-anchor="middle"><tspan x="130.0" dy="0">sem ordem</tspan><tspan x="130.0" dy="22">gênero • tema</tspan></text><rect x="230" y="355" width="160" height="130" rx="18" fill="#dbe8ec" stroke="#17324d" stroke-width="3"/><text x="310.0" y="389" class="subtitulo" text-anchor="middle"><tspan x="310.0" dy="0">Ordinal</tspan></text><text x="310.0" y="425" class="corpo" text-anchor="middle"><tspan x="310.0" dy="0">com ordem</tspan><tspan x="310.0" dy="22">baixo • médio • alto</tspan></text><rect x="435" y="355" width="160" height="130" rx="18" fill="#f2ddd2" stroke="#a44f32" stroke-width="3"/><text x="515.0" y="389" class="subtitulo" text-anchor="middle"><tspan x="515.0" dy="0">Intervalar</tspan></text><text x="515.0" y="425" class="corpo" text-anchor="middle"><tspan x="515.0" dy="0">diferenças válidas</tspan><tspan x="515.0" dy="22">zero convencional</tspan></text><rect x="615" y="355" width="160" height="130" rx="18" fill="#f2ddd2" stroke="#a44f32" stroke-width="3"/><text x="695.0" y="389" class="subtitulo" text-anchor="middle"><tspan x="695.0" dy="0">Razão</tspan></text><text x="695.0" y="425" class="corpo" text-anchor="middle"><tspan x="695.0" dy="0">zero significativo</tspan><tspan x="695.0" dy="22">palavras • páginas</tspan></text><rect x="820" y="355" width="160" height="130" rx="18" fill="#eadde7" stroke="#69445f" stroke-width="3"/><text x="900.0" y="389" class="subtitulo" text-anchor="middle"><tspan x="900.0" dy="0">Datas</tspan></text><text x="900.0" y="425" class="corpo" text-anchor="middle"><tspan x="900.0" dy="0">ano ou data</tspan><tspan x="900.0" dy="22">ordem • duração</tspan></text><rect x="1000" y="355" width="160" height="130" rx="18" fill="#eadde7" stroke="#69445f" stroke-width="3"/><text x="1080.0" y="389" class="subtitulo" text-anchor="middle"><tspan x="1080.0" dy="0">Horários</tspan></text><text x="1080.0" y="425" class="corpo" text-anchor="middle"><tspan x="1080.0" dy="0">hora do dia</tspan><tspan x="1080.0" dy="22">atenção aos ciclos</tspan></text><rect x="115" y="535" width="440" height="100" rx="18" fill="#d8ebe7" stroke="#256b6b" stroke-width="3"/><text x="335.0" y="569" class="subtitulo" text-anchor="middle"><tspan x="335.0" dy="0">Distinção complementar</tspan></text><text x="335.0" y="605" class="corpo" text-anchor="middle"><tspan x="335.0" dy="0">numéricos também podem ser</tspan><tspan x="335.0" dy="22">discretos ou contínuos</tspan></text><rect x="645" y="535" width="440" height="100" rx="18" fill="#fffdf8" stroke="#d8b26e" stroke-width="3"/><text x="865.0" y="569" class="subtitulo" text-anchor="middle"><tspan x="865.0" dy="0">Identificador</tspan></text><text x="865.0" y="605" class="corpo" text-anchor="middle"><tspan x="865.0" dy="0">identifica, mesmo se parecer número</tspan><tspan x="865.0" dy="22">não se soma nem recebe média</tspan></text><text x="600" y="684" class="nota" text-anchor="middle"><tspan x="600" dy="0">O dtype do arquivo não substitui a decisão teórica sobre a variável</tspan></text>
</svg>
