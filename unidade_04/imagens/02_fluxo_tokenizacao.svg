<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480"
 role="img" aria-labelledby="titulo descricao">
<title id="titulo">Fluxo de tokenização e normalização</title>
<desc id="descricao">O texto preservado passa por normalização, tokenização, filtro e contagem. Linhas tracejadas indicam possíveis perdas de capitalização, pontuação, fronteiras e palavras funcionais.</desc>
<defs>
  <marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="3"
   orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#17324d"/>
  </marker>
  <style>
    .titulo { font: 700 30px system-ui, sans-serif; fill: #17324d; }
    .subtitulo { font: 700 19px system-ui, sans-serif; fill: #17324d; }
    .corpo { font: 16px system-ui, sans-serif; fill: #17324d; }
    .pequeno { font: 14px system-ui, sans-serif; fill: #17324d; }
    .nota { font: italic 15px system-ui, sans-serif; fill: #53606c; }
    .seta { stroke: #17324d; stroke-width: 3; fill: none; marker-end: url(#seta); }
    .linha { stroke: #17324d; stroke-width: 3; fill: none; }
    .tracejada { stroke-dasharray: 9 7; }
  </style>
</defs>
<rect width="1200" height="480" rx="28" fill="#fbf4e8"/>
<text x="600" y="44" class="titulo" text-anchor="middle"><tspan x="600" dy="0">Cada regra transforma o texto e pode apagar distinções</tspan></text><rect x="45" y="115" width="150" height="145" rx="18" fill="#fffdf8" stroke="#d8b26e" stroke-width="3"/><text x="120.0" y="149" class="subtitulo" text-anchor="middle"><tspan x="120.0" dy="0">Texto preservado</tspan></text><text x="120.0" y="185" class="corpo" text-anchor="middle"><tspan x="120.0" dy="0">forma recebida</tspan><tspan x="120.0" dy="22">e ID da fonte</tspan></text><path class="seta" d="M199,188 H275"/><rect x="285" y="115" width="150" height="145" rx="18" fill="#dbe8ec" stroke="#17324d" stroke-width="3"/><text x="360.0" y="149" class="subtitulo" text-anchor="middle"><tspan x="360.0" dy="0">Normalizar</tspan></text><text x="360.0" y="185" class="corpo" text-anchor="middle"><tspan x="360.0" dy="0">minúsculas</tspan><tspan x="360.0" dy="22">e pontuação</tspan></text><path class="seta" d="M439,188 H515"/><rect x="525" y="115" width="150" height="145" rx="18" fill="#d8ebe7" stroke="#256b6b" stroke-width="3"/><text x="600.0" y="149" class="subtitulo" text-anchor="middle"><tspan x="600.0" dy="0">Tokenizar</tspan></text><text x="600.0" y="185" class="corpo" text-anchor="middle"><tspan x="600.0" dy="0">segmentar segundo</tspan><tspan x="600.0" dy="22">uma regra</tspan></text><path class="seta" d="M679,188 H755"/><rect x="765" y="115" width="150" height="145" rx="18" fill="#f2ddd2" stroke="#a44f32" stroke-width="3"/><text x="840.0" y="149" class="subtitulo" text-anchor="middle"><tspan x="840.0" dy="0">Filtrar</tspan></text><text x="840.0" y="185" class="corpo" text-anchor="middle"><tspan x="840.0" dy="0">stopwords</tspan><tspan x="840.0" dy="22">declaradas</tspan></text><path class="seta" d="M919,188 H995"/><rect x="1005" y="115" width="150" height="145" rx="18" fill="#eadde7" stroke="#69445f" stroke-width="3"/><text x="1080.0" y="149" class="subtitulo" text-anchor="middle"><tspan x="1080.0" dy="0">Contar</tspan></text><text x="1080.0" y="185" class="corpo" text-anchor="middle"><tspan x="1080.0" dy="0">frequência</tspan><tspan x="1080.0" dy="22">e denominador</tspan></text><path class="linha tracejada" d="M360,270 V330"/><text x="360" y="355" class="pequeno" text-anchor="middle"><tspan x="360" dy="0">capitalização</tspan></text><path class="linha tracejada" d="M600,270 V330"/><text x="600" y="355" class="pequeno" text-anchor="middle"><tspan x="600" dy="0">pontuação</tspan></text><path class="linha tracejada" d="M840,270 V330"/><text x="840" y="355" class="pequeno" text-anchor="middle"><tspan x="840" dy="0">fronteiras</tspan></text><path class="linha tracejada" d="M1080,270 V330"/><text x="1080" y="355" class="pequeno" text-anchor="middle"><tspan x="1080" dy="0">palavras funcionais</tspan></text><text x="600" y="425" class="nota" text-anchor="middle"><tspan x="600" dy="0">Preservar o original permite revisar o que cada transformação retirou</tspan></text>
</svg>
