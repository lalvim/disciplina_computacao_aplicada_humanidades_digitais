lass="subtitulo" text-anchor="middle"><tspan x="170.0" dy="0">Termos</tspan></text><text x="170.0" y="575" class="corpo" text-anchor="middle"></text><rect x="405" y="505" width="330" height="75" rx="18" fill="#fffdf8" stroke="#8a6528" stroke-width="3"/><text x="570.0" y="539" class="subtitulo" text-anchor="middle"><tspan x="570.0" dy="0">Quais são frequentes?</tspan></text><text x="570.0" y="575" class="corpo" text-anchor="middle"></text><rect x="845" y="505" width="310" height="75" rx="18" fill="#f1e2bd" stroke="#8a6528" stroke-width="3"/><text x="1000.0" y="539" class="subtitulo" text-anchor="middle"><tspan x="1000.0" dy="0">Barras</tspan></text><text x="1000.0" y="575" class="corpo" text-anchor="middle"></text><path class="seta" d="M300,543 H395"/><path class="seta" d="M740,543 H835"/>
</svg>
