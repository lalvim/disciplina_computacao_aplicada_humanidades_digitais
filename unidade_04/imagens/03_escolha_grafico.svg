<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620"
 role="img" aria-labelledby="titulo descricao">
<title id="titulo">Escolha de gráficos pela pergunta e pelas variáveis</title>
<desc id="descricao">Cinco linhas ligam tipos de dados e perguntas a barras, histograma e boxplot, dispersão, pontos e linha, ou barras de termos.</desc>
<defs>
  <marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="3"
   orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#17324d"/>
  </marker>
  <style>
    .titulo { font: 700 30px system-ui, sans-serif; fill: #17324d; }
    .subtitulo { font: 700 19px system-ui, sans-serif; fill: #17324d; }
    .corpo { font: 16px system-ui, sans-serif; fill: #17324d; }
    .pequeno { font: 14px system-ui, sans-serif; fill: #17324d; }
    .nota { font: italic 15px system-ui, sans-serif; fill: #53606c; }
    .seta { stroke: #17324d; stroke-width: 3; fill: none; marker-end: url(#seta); }
    .linha { stroke: #17324d; stroke-width: 3; fill: none; }
    .tracejada { stroke-dasharray: 9 7; }
  </style>
</defs>
<rect width="1200" height="620" rx="28" fill="#fbf4e8"/>
<text x="600" y="44" class="titulo" text-anchor="middle"><tspan x="600" dy="0">Comece pela pergunta, não pelo formato</tspan></text><rect x="45" y="105" width="250" height="75" rx="18" fill="#dbe8ec" stroke="#17324d" stroke-width="3"/><text x="170.0" y="139" class="subtitulo" text-anchor="middle"><tspan x="170.0" dy="0">Categorias</tspan></text><text x="170.0" y="175" class="corpo" text-anchor="middle"></text><rect x="405" y="105" width="330" height="75" rx="18" fill="#fffdf8" stroke="#17324d" stroke-width="3"/><text x="570.0" y="139" class="subtitulo" text-anchor="middle"><tspan x="570.0" dy="0">Como se distribuem?</tspan></text><text x="570.0" y="175" class="corpo" text-anchor="middle"></text><rect x="845" y="105" width="310" height="75" rx="18" fill="#dbe8ec" stroke="#17324d" stroke-width="3"/><text x="1000.0" y="139" class="subtitulo" text-anchor="middle"><tspan x="1000.0" dy="0">Barras</tspan></text><text x="1000.0" y="175" class="corpo" text-anchor="middle"></text><path class="seta" d="M300,143 H395"/><path class="seta" d="M740,143 H835"/><rect x="45" y="205" width="250" height="75" rx="18" fill="#d8ebe7" stroke="#256b6b" stroke-width="3"/><text x="170.0" y="239" class="subtitulo" text-anchor="middle"><tspan x="170.0" dy="0">Uma quantitativa</tspan></text><text x="170.0" y="275" class="corpo" text-anchor="middle"></text><rect x="405" y="205" width="330" height="75" rx="18" fill="#fffdf8" stroke="#256b6b" stroke-width="3"/><text x="570.0" y="239" class="subtitulo" text-anchor="middle"><tspan x="570.0" dy="0">Como varia?</tspan></text><text x="570.0" y="275" class="corpo" text-anchor="middle"></text><rect x="845" y="205" width="310" height="75" rx="18" fill="#d8ebe7" stroke="#256b6b" stroke-width="3"/><text x="1000.0" y="239" class="subtitulo" text-anchor="middle"><tspan x="1000.0" dy="0">Histograma + boxplot</tspan></text><text x="1000.0" y="275" class="corpo" text-anchor="middle"></text><path class="seta" d="M300,243 H395"/><path class="seta" d="M740,243 H835"