<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430"
 role="img" aria-labelledby="titulo descricao">
<title id="titulo">Cadeia argumentativa de uma visualização</title>
<desc id="descricao">Pergunta, tabela, figura, leitura e limite aparecem em sequência. A legenda afirma que divergências entre tabela e figura exigem revisão.</desc>
<defs>
  <marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="3"
   orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#17324d"/>
  </marker>
  <style>
    .titulo { font: 700 30px system-ui, sans-serif; fill: #17324d; }
    .subtitulo { font: 700 19px system-ui, sans-serif; fill: #17324d; }
    .corpo { font: 16px system-ui, sans-serif; fill: #17324d; }
    .pequeno { font: 14px system-ui, sans-serif; fill: #17324d; }
    .nota { font: italic 15px system-ui, sans-serif; fill: #53606c; }
    .seta { stroke: #17324d; stroke-width: 3; fill: none; marker-end: url(#seta); }
    .linha { stroke: #17324d; stroke-width: 3; fill: none; }
    .tracejada { stroke-dasharray: 9 7; }
  </style>
</defs>
<rect width="1200" height="430" rx="28" fill="#fbf4e8"/>
<text x="600" y="44" class="titulo" text-anchor="middle"><tspan x="600" dy="0">Uma figura participa de uma cadeia argumentativa</tspan></text><rect x="60" y="140" width="160" height="145" rx="18" fill="#dbe8ec" stroke="#17324d" stroke-width="3"/><text x="140.0" y="174" class="subtitulo" text-anchor="middle"><tspan x="140.0" dy="0">Pergunta</tspan></text><text x="140.0" y="210" class="corpo" text-anchor="middle"><tspan x="140.0" dy="0">o que se quer</tspan><tspan x="140.0" dy="22">descrever?</tspan></text><path class="seta" d="M224,212 H280"/><rect x="290" y="140" width="160" height="145" rx="18" fill="#d8ebe7" stroke="#256b6b" stroke-width="3"/><text x="370.0" y="174" class="subtitulo" text-anchor="middle"><tspan x="370.0" dy="0">Tabela</tspan></text><text x="370.0" y="210" class="corpo" text-anchor="middle"><tspan x="370.0" dy="0">valores e</tspan><tspan x="370.0" dy="22">denominador</tspan></text><path class="seta" d="M454,212 H510"/><rect x="520" y="140" width="160" height="145" rx="18" fill="#f2ddd2" stroke="#a44f32" stroke-width="3"/><text x="600.0" y="174" class="subtitulo" text-anchor="middle"><tspan x="600.0" dy="0">Figura</tspan></text><text x="600.0" y="210" class="corpo" text-anchor="middle"><tspan x="600.0" dy="0">escala, unidade</tspan><tspan x="600.0" dy="22">e casos</tspan></text><path class="seta" d="M684,212 H740"/><rect x="750" y="140" width="160" height="145" rx="18" fill="#eadde7" stroke="#69445f" stroke-width="3"/><text x="830.0" y="174" class="subtitulo" text-anchor="middle"><tspan x="830.0" dy="0">Leitura</tspan></text><text x="830.0" y="210" class="corpo" text-anchor="middle"><tspan x="830.0" dy="0">descrição +</tspan><tspan x="830.0" dy="22">interpretação</tspan></text><path class="seta" d="M914,212 H970"/><rect x="980" y="140" width="160" height="145" rx="18" fill="#f1e2bd" stroke="#8a6528" stroke-width="3"/><text x="1060.0" y="174" class="subtitulo" text-anchor="middle"><tspan x="1060.0" dy="0">Limite</tspan></text><text x="1060.0" y="210" class="corpo" text-anchor="middle"><tspan x="1060.0" dy="0">o que não</tspan><tspan x="1060.0" dy="22">se conclui</tspan></text><text x="600" y="365" class="nota" text-anchor="middle"><tspan x="600" dy="0">Se a tabela não sustenta a figura, a cadeia precisa ser revista</tspan></text>
</svg>
