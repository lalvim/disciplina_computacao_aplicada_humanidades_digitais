<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470"
 role="img" aria-labelledby="titulo descricao">
<title id="titulo">Percurso da comparação</title>
<desc id="descricao">Seis etapas ligam pergunta, estimativa, incerteza, representação, medida e interpretação, com retorno para revisão.</desc>
<defs>
 <marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#17324d"/></marker>
 <style>.titulo{font:700 29px system-ui;fill:#17324d}.subtitulo{font:700 18px system-ui;fill:#17324d}.corpo{font:16px system-ui;fill:#17324d}.nota{font:italic 15px system-ui;fill:#53606c}.seta{stroke:#17324d;stroke-width:3;fill:none;marker-end:url(#seta)}.linha{stroke:#17324d;stroke-width:3;fill:none}.tracejada{stroke-dasharray:8 7}</style>
</defs><rect width="1200" height="470" rx="28" fill="#fbf4e8"/><text x="600" y="44" class="titulo" text-anchor="middle"><tspan x="600" dy="0">Comparar é uma cadeia de decisões</tspan></text><rect x="35" y="125" width="155" height="145" rx="16" fill="#dbe8ec" stroke="#17324d" stroke-width="3"/><text x="112.5" y="157" class="subtitulo" text-anchor="middle"><tspan x="112.5" dy="0">Pergunta</tspan></text><text x="112.5" y="191" class="corpo" text-anchor="middle"><tspan x="112.5" dy="0">unidades e</tspan><tspan x="112.5" dy="22">subconjuntos</tspan></text><path class="seta" d="M193,197 H225"/><rect x="230" y="125" width="155" height="145" rx="16" fill="#d8ebe7" stroke="#256b6b" stroke-width="3"/><text x="307.5" y="157" class="subtitulo" text-anchor="middle"><tspan x="307.5" dy="0">Estimar</tspan></text><text x="307.5" y="191" class="corpo" text-anchor="middle"><tspan x="307.5" dy="0">diferença</tspan><tspan x="307.5" dy="22">e escala</tspan></text><path class="seta" d="M388,197 H420"/><rect x="425" y="125" width="155" height="145" rx="16" fill="#f1e2bd" stroke="#8a6528" stroke-width="3"/><text x="502.5" y="157" class="subtitulo" text-anchor="middle"><tspan x="502.5" dy="0">Incerteza</tspan></text><text x="502.5" y="191" class="corpo" text-anchor="middle"><tspan x="502.5" dy="0">procedimento e</tspan><tspan x="502.5" dy="22">pressupostos</tspan></text><path class="seta" d="M583,197 H615"/><rect x="620" y="125" width="155" height="145" rx="16" fill="#efdde1" stroke="#7b3545" stroke-width="3"/><text x="697.5" y="157" class="subtitulo" text-anchor="middle"><tspan x="697.5" dy="0">Representar</tspan></text><text x="697.5" y="191" class="corpo" text-anchor="middle"><tspan x="697.5" dy="0">termos, pesos</tspan><tspan x="697.5" dy="22">e sequências</tspan></text><path class="seta" d="M778,197 H810"/><rect x="815" y="125" width="155" height="145" rx="16" fill="#dbe8ec" stroke="#17324d" stroke-width="3"/><text x="892.5" y="157" class="subtitulo" text-anchor="middle"><tspan x="892.5" dy="0">Comparar</tspan></text><text x="892.5" y="191" class="corpo" text-anchor="middle"><tspan x="892.5" dy="0">medida e</tspan><tspan x="892.5" dy="22">sensibilidade</tspan></text><path class="seta" d="M973,197 H1005"/><rect x="1010" y="125" width="155" height="145" rx="16" fill="#d8ebe7" stroke="#256b6b" stroke-width="3"/><text x="1087.5" y="157" class="subtitulo" text-anchor="middle"><tspan x="1087.5" dy="0">Interpretar</tspan></text><text x="1087.5" y="191" class="corpo" text-anchor="middle"><tspan x="1087.5" dy="0">casos, contexto</tspan><tspan x="1087.5" dy="22">e limites</tspan></text><path class="seta tracejada" d="M1080,290 C1080,455 125,455 115,290"/><text x="600" y="385" class="nota" text-anchor="middle"><tspan x="600" dy="0">Uma medida alternativa ou um caso divergente pode exigir revisão</tspan></text></svg>