<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420"
 role="img" aria-labelledby="titulo descricao">
<title id="titulo">Diferença, incerteza e relevância</title>
<desc id="descricao">Três caixas separam tamanho observado, variabilidade do procedimento e importância substantiva no contexto.</desc>
<defs>
 <marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#17324d"/></marker>
 <style>.titulo{font:700 29px system-ui;fill:#17324d}.subtitulo{font:700 18px system-ui;fill:#17324d}.corpo{font:16px system-ui;fill:#17324d}.nota{font:italic 15px system-ui;fill:#53606c}.seta{stroke:#17324d;stroke-width:3;fill:none;marker-end:url(#seta)}.linha{stroke:#17324d;stroke-width:3;fill:none}.tracejada{stroke-dasharray:8 7}</style>
</defs><rect width="1200" height="420" rx="28" fill="#fbf4e8"/><text x="600" y="44" class="titulo" text-anchor="middle"><tspan x="600" dy="0">Diferença observada não basta</tspan></text><rect x="70" y="125" width="270" height="155" rx="16" fill="#dbe8ec" stroke="#17324d" stroke-width="3"/><text x="205.0" y="157" class="subtitulo" text-anchor="middle"><tspan x="205.0" dy="0">Diferença</tspan></text><text x="205.0" y="191" class="corpo" text-anchor="middle"><tspan x="205.0" dy="0">quanto A e B</tspan><tspan x="205.0" dy="22">se afastam?</tspan></text><rect x="465" y="125" width="270" height="155" rx="16" fill="#f1e2bd" stroke="#8a6528" stroke-width="3"/><text x="600.0" y="157" class="subtitulo" text-anchor="middle"><tspan x="600.0" dy="0">Incerteza</tspan></text><text x="600.0" y="191" class="corpo" text-anchor="middle"><tspan x="600.0" dy="0">quanto variaria</tspan><tspan x="600.0" dy="22">o procedimento?</tspan></text><rect x="860" y="125" width="270" height="155" rx="16" fill="#d8ebe7" stroke="#256b6b" stroke-width="3"/><text x="995.0" y="157" class="subtitulo" text-anchor="middle"><tspan x="995.0" dy="0">Relevância</tspan></text><text x="995.0" y="191" class="corpo" text-anchor="middle"><tspan x="995.0" dy="0">o tamanho importa</tspan><tspan x="995.0" dy="22">para a pergunta?</tspan></text><path class="seta" d="M345,202 H455"/><path class="seta" d="M740,202 H850"/><text x="600" y="355" class="nota" text-anchor="middle"><tspan x="600" dy="0">Escala original + distribuição + desenho dos dados + contexto</tspan></text></svg>