<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 510"
 role="img" aria-labelledby="titulo descricao">
<title id="titulo">Distribuição nula e resultado observado</title>
<desc id="descricao">Histograma simétrico de resultados permutados marca as duas caudas e o resultado observado, sem usar um limiar automático.</desc>
<defs>
 <marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#17324d"/></marker>
 <style>.titulo{font:700 29px system-ui;fill:#17324d}.subtitulo{font:700 18px system-ui;fill:#17324d}.corpo{font:16px system-ui;fill:#17324d}.nota{font:italic 15px system-ui;fill:#53606c}.seta{stroke:#17324d;stroke-width:3;fill:none;marker-end:url(#seta)}.linha{stroke:#17324d;stroke-width:3;fill:none}.tracejada{stroke-dasharray:8 7}</style>
</defs><rect width="1200" height="510" rx="28" fill="#fbf4e8"/><text x="600" y="42" class="titulo" text-anchor="middle"><tspan x="600" dy="0">Distribuição de referência sob a hipótese nula</tspan></text><rect x="150" y="372" width="38" height="18" fill="#7b3545" stroke="#17324d"/><rect x="202" y="362" width="38" height="28" fill="#7b3545" stroke="#17324d"/><rect x="254" y="348" width="38" height="42" fill="#dbe8ec" stroke="#17324d"/><rect x="306" y="325" width="38" height="65" fill="#dbe8ec" stroke="#17324d"/><rect x="358" y="295" width="38" height="95" fill="#dbe8ec" stroke="#17324d"/><rect x="410" y="260" width="38" height="130" fill="#dbe8ec" stroke="#17324d"/><rect x="462" y="220" width="38" height="170" fill="#dbe8ec" stroke="#17324d"/><rect x="514" y="185" width="38" height="205" fill="#dbe8ec" stroke="#17324d"/><rect x="566" y="160" width="38" height="230" fill="#dbe8ec" stroke="#17324d"/><rect x="618" y="185" width="38" height="205" fill="#dbe8ec" stroke="#17324d"/><rect x="670" y="220" width="38" height="170" fill="#dbe8ec" stroke="#17324d"/><rect x="722" y="260" width="38" height="130" fill="#dbe8ec" stroke="#17324d"/><rect x="774" y="295" width="38" height="95" fill="#dbe8ec" stroke="#17324d"/><rect x="826" y="325" width="38" height="65" fill="#dbe8ec" stroke="#17324d"/><rect x="878" y="348" width="38" height="42" fill="#dbe8ec" stroke="#17324d"/><rect x="930" y="362" width="38" height="28" fill="#7b3545" stroke="#17324d"/><rect x="982" y="372" width="38" height="18" fill="#7b3545" stroke="#17324d"/><line x1="120" y1="390" x2="1080" y2="390" class="linha"/><line x1="960" y1="100" x2="960" y2="400" stroke="#7b3545" stroke-width="4"/><text x="960" y="85" class="subtitulo" text-anchor="middle"><tspan x="960" dy="0">resultado observado</tspan></text><text x="600" y="455" class="nota" text-anchor="middle"><tspan x="600" dy="0">O valor de p é a proporção de resultados tão ou mais extremos sob o modelo nulo</tspan></text></svg>