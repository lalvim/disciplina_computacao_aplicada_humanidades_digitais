<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410"
 role="img" aria-labelledby="titulo descricao">
<title id="titulo">Mapa de interpretação inferencial</title>
<desc id="descricao">Quatro caixas distinguem estimativa, intervalo, valor de p e relevância contextual, seguidas por alerta sobre desenho e teoria.</desc>
<defs>
 <marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#17324d"/></marker>
 <style>.titulo{font:700 29px system-ui;fill:#17324d}.subtitulo{font:700 18px system-ui;fill:#17324d}.corpo{font:16px system-ui;fill:#17324d}.nota{font:italic 15px system-ui;fill:#53606c}.seta{stroke:#17324d;stroke-width:3;fill:none;marker-end:url(#seta)}.linha{stroke:#17324d;stroke-width:3;fill:none}.tracejada{stroke-dasharray:8 7}</style>
</defs><rect width="1200" height="410" rx="28" fill="#fbf4e8"/><text x="600" y="42" class="titulo" text-anchor="middle"><tspan x="600" dy="0">O que cada resultado responde</tspan></text><rect x="55" y="120" width="250" height="150" rx="16" fill="#dbe8ec" stroke="#17324d" stroke-width="3"/><text x="180.0" y="152" class="subtitulo" text-anchor="middle"><tspan x="180.0" dy="0">Estimativa</tspan></text><text x="180.0" y="186" class="corpo" text-anchor="middle"><tspan x="180.0" dy="0">qual diferença</tspan><tspan x="180.0" dy="22">foi observada?</tspan></text><rect x="335" y="120" width="250" height="150" rx="16" fill="#d8ebe7" stroke="#256b6b" stroke-width="3"/><text x="460.0" y="152" class="subtitulo" text-anchor="middle"><tspan x="460.0" dy="0">Intervalo</tspan></text><text x="460.0" y="186" class="corpo" text-anchor="middle"><tspan x="460.0" dy="0">que valores são</tspan><tspan x="460.0" dy="22">compatíveis?</tspan></text><rect x="615" y="120" width="250" height="150" rx="16" fill="#f1e2bd" stroke="#8a6528" stroke-width="3"/><text x="740.0" y="152" class="subtitulo" text-anchor="middle"><tspan x="740.0" dy="0">Valor de p</tspan></text><text x="740.0" y="186" class="corpo" text-anchor="middle"><tspan x="740.0" dy="0">compatibilidade com</tspan><tspan x="740.0" dy="22">um modelo nulo</tspan></text><rect x="895" y="120" width="250" height="150" rx="16" fill="#efdde1" stroke="#7b3545" stroke-width="3"/><text x="1020.0" y="152" class="subtitulo" text-anchor="middle"><tspan x="1020.0" dy="0">Contexto</tspan></text><text x="1020.0" y="186" class="corpo" text-anchor="middle"><tspan x="1020.0" dy="0">a diferença é</tspan><tspan x="1020.0" dy="22">substantiva?</tspan></text><text x="600" y="345" class="nota" text-anchor="middle"><tspan x="600" dy="0">Nenhuma caixa substitui desenho, transparência, teoria ou leitura dos casos</tspan></text></svg>