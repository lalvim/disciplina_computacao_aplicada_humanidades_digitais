<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420"
 role="img" aria-labelledby="titulo descricao">
<title id="titulo">Anatomia do TF-IDF</title>
<desc id="descricao">TF mede frequência local, IDF mede raridade documental e o produto gera um peso dependente da convenção escolhida.</desc>
<defs>
 <marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#17324d"/></marker>
 <style>.titulo{font:700 29px system-ui;fill:#17324d}.subtitulo{font:700 18px system-ui;fill:#17324d}.corpo{font:16px system-ui;fill:#17324d}.nota{font:italic 15px system-ui;fill:#53606c}.seta{stroke:#17324d;stroke-width:3;fill:none;marker-end:url(#seta)}.linha{stroke:#17324d;stroke-width:3;fill:none}.tracejada{stroke-dasharray:8 7}</style>
</defs><rect width="1200" height="420" rx="28" fill="#fbf4e8"/><text x="600" y="42" class="titulo" text-anchor="middle"><tspan x="600" dy="0">TF-IDF combina presença local e raridade na coleção</tspan></text><rect x="85" y="120" width="300" height="160" rx="16" fill="#dbe8ec" stroke="#17324d" stroke-width="3"/><text x="235.0" y="152" class="subtitulo" text-anchor="middle"><tspan x="235.0" dy="0">TF</tspan></text><text x="235.0" y="186" class="corpo" text-anchor="middle"><tspan x="235.0" dy="0">quanto o termo</tspan><tspan x="235.0" dy="22">aparece no documento</tspan></text><rect x="455" y="120" width="300" height="160" rx="16" fill="#f1e2bd" stroke="#8a6528" stroke-width="3"/><text x="605.0" y="152" class="subtitulo" text-anchor="middle"><tspan x="605.0" dy="0">IDF</tspan></text><text x="605.0" y="186" class="corpo" text-anchor="middle"><tspan x="605.0" dy="0">em quantos documentos</tspan><tspan x="605.0" dy="22">o termo aparece</tspan></text><rect x="825" y="120" width="300" height="160" rx="16" fill="#d8ebe7" stroke="#256b6b" stroke-width="3"/><text x="975.0" y="152" class="subtitulo" text-anchor="middle"><tspan x="975.0" dy="0">TF × IDF</tspan></text><text x="975.0" y="186" class="corpo" text-anchor="middle"><tspan x="975.0" dy="0">peso sob uma</tspan><tspan x="975.0" dy="22">convenção declarada</tspan></text><path class="seta" d="M390,200 H445"/><path class="seta" d="M760,200 H815"/><text x="600" y="355" class="nota" text-anchor="middle"><tspan x="600" dy="0">Peso alto não equivale automaticamente a importância histórica ou temática</tspan></text></svg>