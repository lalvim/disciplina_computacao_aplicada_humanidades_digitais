<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420"
 role="img" aria-labelledby="titulo descricao">
<title id="titulo">Construção da matriz documento-termo</title>
<desc id="descricao">Quatro etapas ligam documentos preservados, tokens, vocabulário e uma matriz; a nota registra a perda de ordem e sintaxe.</desc>
<defs>
 <marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#17324d"/></marker>
 <style>.titulo{font:700 29px system-ui;fill:#17324d}.subtitulo{font:700 18px system-ui;fill:#17324d}.corpo{font:16px system-ui;fill:#17324d}.nota{font:italic 15px system-ui;fill:#53606c}.seta{stroke:#17324d;stroke-width:3;fill:none;marker-end:url(#seta)}.linha{stroke:#17324d;stroke-width:3;fill:none}.tracejada{stroke-dasharray:8 7}</style>
</defs><rect width="1200" height="420" rx="28" fill="#fbf4e8"/><text x="600" y="42" class="titulo" text-anchor="middle"><tspan x="600" dy="0">Do documento à matriz documento-termo</tspan></text><rect x="45" y="125" width="220" height="150" rx="16" fill="#dbe8ec" stroke="#17324d" stroke-width="3"/><text x="155.0" y="157" class="subtitulo" text-anchor="middle"><tspan x="155.0" dy="0">Documentos</tspan></text><text x="155.0" y="191" class="corpo" text-anchor="middle"><tspan x="155.0" dy="0">texto preservado</tspan><tspan x="155.0" dy="22">e identificador</tspan></text><path class="seta" d="M270,200 H305"/><rect x="315" y="125" width="220" height="150" rx="16" fill="#d8ebe7" stroke="#256b6b" stroke-width="3"/><text x="425.0" y="157" class="subtitulo" text-anchor="middle"><tspan x="425.0" dy="0">Tokens</tspan></text><text x="425.0" y="191" class="corpo" text-anchor="middle"><tspan x="425.0" dy="0">regra explícita</tspan><tspan x="425.0" dy="22">de normalização</tspan></text><path class="seta" d="M540,200 H575"/><rect x="585" y="125" width="220" height="150" rx="16" fill="#f1e2bd" stroke="#8a6528" stroke-width="3"/><text x="695.0" y="157" class="subtitulo" text-anchor="middle"><tspan x="695.0" dy="0">Vocabulário</tspan></text><text x="695.0" y="191" class="corpo" text-anchor="middle"><tspan x="695.0" dy="0">termos nas</tspan><tspan x="695.0" dy="22">colunas</tspan></text><path class="seta" d="M810,200 H845"/><rect x="855" y="125" width="220" height="150" rx="16" fill="#efdde1" stroke="#7b3545" stroke-width="3"/><text x="965.0" y="157" class="subtitulo" text-anchor="middle"><tspan x="965.0" dy="0">Matriz</tspan></text><text x="965.0" y="191" class="corpo" text-anchor="middle"><tspan x="965.0" dy="0">documentos ×</tspan><tspan x="965.0" dy="22">termos e pesos</tspan></text><text x="600" y="350" class="nota" text-anchor="middle"><tspan x="600" dy="0">Ordem e sintaxe são perdidas; a ligação com o texto permite retornar ao contexto</tspan></text></svg>