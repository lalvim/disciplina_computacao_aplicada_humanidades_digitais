text-anchor="middle"><tspan x="700.0" dy="0">REABRE</tspan></text><text x="700.0" y="366" class="corpo" text-anchor="middle"></text><rect x="825" y="300" width="160" height="70" rx="16" fill="#d8ebe7" stroke="#256b6b" stroke-width="3"/><text x="905.0" y="332" class="subtitulo" text-anchor="middle"><tspan x="905.0" dy="0">AMANHÃ</tspan></text><text x="905.0" y="366" class="corpo" text-anchor="middle"></text><path class="linha tracejada" d="M290,185 V295"/><path class="linha tracejada" d="M495,185 V295"/><path class="linha tracejada" d="M700,185 V295"/><path class="linha tracejada" d="M905,185 V295"/><text x="600" y="235" class="nota" text-anchor="middle"><tspan x="600" dy="0">manter • substituir • inserir • excluir</tspan></text><text x="600" y="440" class="nota" text-anchor="middle"><tspan x="600" dy="0">A distância localiza esforço de transformação; não interpreta o sentido da mudança</tspan></text></svg>