<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560"
 role="img" aria-labelledby="titulo descricao">
<title id="titulo">Vizinhos documentais sob diferentes medidas</title>
<desc id="descricao">Um documento central se liga a quatro vizinhos encontrados por métricas diferentes, incluindo um caso divergente para inspeção.</desc>
<defs>
 <marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#17324d"/></marker>
 <style>.titulo{font:700 29px system-ui;fill:#17324d}.subtitulo{font:700 18px system-ui;fill:#17324d}.corpo{font:16px system-ui;fill:#17324d}.nota{font:italic 15px system-ui;fill:#53606c}.seta{stroke:#17324d;stroke-width:3;fill:none;marker-end:url(#seta)}.linha{stroke:#17324d;stroke-width:3;fill:none}.tracejada{stroke-dasharray:8 7}</style>
</defs><rect width="1200" height="560" rx="28" fill="#fbf4e8"/><text x="600" y="42" class="titulo" text-anchor="middle"><tspan x="600" dy="0">Vizinhos dependem da representação e da métrica</tspan></text><rect x="475" y="190" width="250" height="120" rx="16" fill="#efdde1" stroke="#7b3545" stroke-width="3"/><text x="600.0" y="222" class="subtitulo" text-anchor="middle"><tspan x="600.0" dy="0">Documento consultado</tspan></text><text x="600.0" y="256" class="corpo" text-anchor="middle"><tspan x="600.0" dy="0">texto e contexto</tspan><tspan x="600.0" dy="22">preservados</tspan></text><rect x="80" y="80" width="230" height="100" rx="16" fill="#fffdf8" stroke="#17324d" stroke-width="3"/><text x="195.0" y="112" class="subtitulo" text-anchor="middle"><tspan x="195.0" dy="0">Documento A</tspan></text><text x="195.0" y="146" class="corpo" text-anchor="middle"><tspan x="195.0" dy="0">Jaccard</tspan></text><path class="seta tracejada" d="M600,250 L195,130"/><rect x="875" y="75" width="230" height="100" rx="16" fill="#fffdf8" stroke="#17324d" stroke-width="3"/><text x="990.0" y="107" class="subtitulo" text-anchor="middle"><tspan x="990.0" dy="0">Documento B</tspan></text><text x="990.0" y="141" class="corpo" text-anchor="middle"><tspan x="990.0" dy="0">cosseno TF-IDF</tspan></text><path class="seta tracejada" d="M600,250 L990,125"/><rect x="70" y="350" width="230" height="100" rx="16" fill="#fffdf8" stroke="#17324d" stroke-width="3"/><text x="185.0" y="382" class="subtitulo" text-anchor="middle"><tspan x="185.0" dy="0">Documento C</tspan></text><text x="185.0" y="416" class="corpo" text-anchor="middle"><tspan x="185.0" dy="0">cosseno contagens</tspan></text><path class="seta tracejada" d="M600,250 L185,400"/><rect x="890" y="355" width="230" height="100" rx="16" fill="#fffdf8" stroke="#17324d" stroke-width="3"/><text x="1005.0" y="387" class="subtitulo" text-anchor="middle"><tspan x="1005.0" dy="0">Documento D</tspan></text><text x="1005.0" y="421" class="corpo" text-anchor="middle"><tspan x="1005.0" dy="0">caso divergente</tspan></text><path class="seta tracejada" d="M600,250 L1005,405"/><text x="600" y="500" class="nota" text-anchor="middle"><tspan x="600" dy="0">Inspecionar pares concordantes e divergentes revela o que cada medida privilegia</tspan></text></svg>