<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460"
 role="img" aria-labelledby="titulo descricao">
<title id="titulo">Cadeia do argumento comparativo</title>
<desc id="descricao">Pergunta, medida, resultado, casos e argumento aparecem em sequência com retorno para nova especificação.</desc>
<defs>
 <marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#17324d"/></marker>
 <style>.titulo{font:700 29px system-ui;fill:#17324d}.subtitulo{font:700 18px system-ui;fill:#17324d}.corpo{font:16px system-ui;fill:#17324d}.nota{font:italic 15px system-ui;fill:#53606c}.seta{stroke:#17324d;stroke-width:3;fill:none;marker-end:url(#seta)}.linha{stroke:#17324d;stroke-width:3;fill:none}.tracejada{stroke-dasharray:8 7}</style>
</defs><rect width="1200" height="460" rx="28" fill="#fbf4e8"/><text x="600" y="42" class="titulo" text-anchor="middle"><tspan x="600" dy="0">Do resultado comparativo ao argumento</tspan></text><rect x="45" y="125" width="185" height="145" rx="16" fill="#dbe8ec" stroke="#17324d" stroke-width="3"/><text x="137.5" y="157" class="subtitulo" text-anchor="middle"><tspan x="137.5" dy="0">Pergunta</tspan></text><text x="137.5" y="191" class="corpo" text-anchor="middle"><tspan x="137.5" dy="0">comparação</tspan><tspan x="137.5" dy="22">delimitada</tspan></text><path class="seta" d="M235,198 H265"/><rect x="275" y="125" width="185" height="145" rx="16" fill="#d8ebe7" stroke="#256b6b" stroke-width="3"/><text x="367.5" y="157" class="subtitulo" text-anchor="middle"><tspan x="367.5" dy="0">Medida</tspan></text><text x="367.5" y="191" class="corpo" text-anchor="middle"><tspan x="367.5" dy="0">convenção e</tspan><tspan x="367.5" dy="22">pressupostos</tspan></text><path class="seta" d="M465,198 H495"/><rect x="505" y="125" width="185" height="145" rx="16" fill="#f1e2bd" stroke="#8a6528" stroke-width="3"/><text x="597.5" y="157" class="subtitulo" text-anchor="middle"><tspan x="597.5" dy="0">Resultado</tspan></text><text x="597.5" y="191" class="corpo" text-anchor="middle"><tspan x="597.5" dy="0">diferença ou</tspan><tspan x="597.5" dy="22">similaridade</tspan></text><path class="seta" d="M695,198 H725"/><rect x="735" y="125" width="185" height="145" rx="16" fill="#efdde1" stroke="#7b3545" stroke-width="3"/><text x="827.5" y="157" class="subtitulo" text-anchor="middle"><tspan x="827.5" dy="0">Casos</tspan></text><text x="827.5" y="191" class="corpo" text-anchor="middle"><tspan x="827.5" dy="0">documentos e</tspan><tspan x="827.5" dy="22">exceções</tspan></text><path class="seta" d="M925,198 H955"/><rect x="965" y="125" width="185" height="145" rx="16" fill="#dbe8ec" stroke="#17324d" stroke-width="3"/><text x="1057.5" y="157" class="subtitulo" text-anchor="middle"><tspan x="1057.5" dy="0">Argumento</tspan></text><text x="1057.5" y="191" class="corpo" text-anchor="middle"><tspan x="1057.5" dy="0">relevância</tspan><tspan x="1057.5" dy="22">e limites</tspan></text><path class="seta tracejada" d="M1055,290 C1055,445 140,445 140,290"/><text x="600" y="375" class="nota" text-anchor="middle"><tspan x="600" dy="0">Sensibilidade ou caso contraditório pode exigir uma nova especificação</tspan></text></svg>