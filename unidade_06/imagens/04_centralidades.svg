<svg xmlns="http://www.w3.org/2000/svg" width="980" height="280" viewBox="0 0 980 280" role="img" aria-labelledby="title desc"><title id="title">Medidas de posição</title><desc id="desc">Grau, força e intermediação respondem perguntas diferentes.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#a44a3f"/></marker></defs><rect width="100%" height="100%" fill="#fffdf8"/><text x="490" y="42" text-anchor="middle" font-size="25" font-weight="bold" fill="#172b35">Medidas de posição</text><rect x="40" y="90" width="250" height="105" rx="14" fill="#f4f0e6" stroke="#294c60" stroke-width="2"/><text x="165" y="135" text-anchor="middle" font-size="18" fill="#172b35">grau</text><path d="M298 142 H355" stroke="#a44a3f" stroke-width="3" marker-end="url(#a)"/><rect x="365" y="90" width="250" height="105" rx="14" fill="#f4f0e6" stroke="#294c60" stroke-width="2"/><text x="490" y="135" text-anchor="middle" font-size="18" fill="#172b35">força</text><path d="M623 142 H680" stroke="#a44a3f" stroke-width="3" marker-end="url(#a)"/><rect x="690" y="90" width="250" height="105" rx="14" fill="#f4f0e6" stroke="#294c60" stroke-width="2"/><text x="815" y="135" text-anchor="middle" font-size="18" fill="#172b35">intermediação</text><text x="490" y="242" text-anchor="middle" font-size="16" fill="#46565e">Toda relação depende da regra que produziu os dados.</text></svg>