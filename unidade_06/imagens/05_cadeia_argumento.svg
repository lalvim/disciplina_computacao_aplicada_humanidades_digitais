<svg xmlns="http://www.w3.org/2000/svg" width="980" height="280" viewBox="0 0 980 280" role="img" aria-labelledby="title desc"><title id="title">Cadeia do argumento</title><desc id="desc">Dados, modelo, resultado e interpretação limitada.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#a44a3f"/></marker></defs><rect width="100%" height="100%" fill="#fffdf8"/><text x="490" y="42" text-anchor="middle" font-size="25" font-weight="bold" fill="#172b35">Cadeia do argumento</text><rect x="40" y="90" width="190" height="105" rx="14" fill="#f4f0e6" stroke="#294c60" stroke-width="2"/><text x="135" y="135" text-anchor="middle" font-size="18" fill="#172b35">dados</text><path d="M238 142 H267" stroke="#a44a3f" stroke-width="3" marker-end="url(#a)"/><rect x="277" y="90" width="190" height="105" rx="14" fill="#f4f0e6" stroke="#294c60" stroke-width="2"/><text x="372" y="135" text-anchor="middle" font-size="18" fill="#172b35">modelo</text><path d="M475 142 H503" stroke="#a44a3f" stroke-width="3" marker-end="url(#a)"/><rect x="513" y="90" width="190" height="105" rx="14" fill="#f4f0e6" stroke="#294c60" stroke-width="2"/><text x="608" y="135" text-anchor="middle" font-size="18" fill="#172b35">resultado</text><path d="M711 142 H740" stroke="#a44a3f" stroke-width="3" marker-end="url(#a)"/><rect x="750" y="90" width="190" height="105" rx="14" fill="#f4f0e6" stroke="#294c60" stroke-width="2"/><text x="845" y="135" text-anchor="middle" font-size="18" fill="#172b35">limite</text><text x="490" y="242" text-anchor="middle" font-size="16" fill="#46565e">Toda relação depende da regra que produziu os dados.</text></svg>