<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="285" viewBox="0 0 1000 285" role="img" aria-labelledby="title desc"><title id="title">Condicionar e comparar</title><desc id="desc">Explicativas numéricas e indicadores alimentam uma resposta.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#a44a3f"/></marker></defs><rect width="100%" height="100%" fill="#fffdf8"/><text x="500" y="40" text-anchor="middle" font-size="25" font-weight="bold" fill="#172b35">Condicionar e comparar</text><rect x="40" y="84" width="250" height="116" rx="15" fill="#f4f0e6" stroke="#294c60" stroke-width="2"/><text x="165" y="130" text-anchor="middle" font-size="17" fill="#172b35">Variáveis</text><text x="165" y="155" text-anchor="middle" font-size="17" fill="#172b35">numéricas</text><path d="M297 142 H366" stroke="#a44a3f" stroke-width="3" marker-end="url(#a)"/><rect x="375" y="84" width="250" height="116" rx="15" fill="#f4f0e6" stroke="#294c60" stroke-width="2"/><text x="500" y="130" text-anchor="middle" font-size="17" fill="#172b35">Categoria</text><text x="500" y="155" text-anchor="middle" font-size="17" fill="#172b35">de referência</text><path d="M632 142 H701" stroke="#a44a3f" stroke-width="3" marker-end="url(#a)"/><rect x="710" y="84" width="250" height="116" rx="15" fill="#f4f0e6" stroke="#294c60" stroke-width="2"/><text x="835" y="130" text-anchor="middle" font-size="17" fill="#172b35">Resposta</text><text x="835" y="155" text-anchor="middle" font-size="17" fill="#172b35">prevista</text><text x="500" y="250" text-anchor="middle" font-size="16" fill="#46565e">Controle estatístico não equivale a controle experimental.</text></svg>