<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="285" viewBox="0 0 1000 285" role="img" aria-labelledby="title desc"><title id="title">Diagnosticar é voltar aos casos</title><desc id="desc">Percurso dos previstos aos resíduos e casos.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#a44a3f"/></marker></defs><rect width="100%" height="100%" fill="#fffdf8"/><text x="500" y="40" text-anchor="middle" font-size="25" font-weight="bold" fill="#172b35">Diagnosticar é voltar aos casos</text><rect x="40" y="84" width="200" height="116" rx="15" fill="#f4f0e6" stroke="#294c60" stroke-width="2"/><text x="140" y="130" text-anchor="middle" font-size="17" fill="#172b35">Previstos</text><path d="M247 142 H271" stroke="#a44a3f" stroke-width="3" marker-end="url(#a)"/><rect x="280" y="84" width="200" height="116" rx="15" fill="#f4f0e6" stroke="#294c60" stroke-width="2"/><text x="380" y="130" text-anchor="middle" font-size="17" fill="#172b35">Resíduos</text><path d="M487 142 H511" stroke="#a44a3f" stroke-width="3" marker-end="url(#a)"/><rect x="520" y="84" width="200" height="116" rx="15" fill="#f4f0e6" stroke="#294c60" stroke-width="2"/><text x="620" y="130" text-anchor="middle" font-size="17" fill="#172b35">Casos</text><path d="M727 142 H751" stroke="#a44a3f" stroke-width="3" marker-end="url(#a)"/><rect x="760" y="84" width="200" height="116" rx="15" fill="#f4f0e6" stroke="#294c60" stroke-width="2"/><text x="860" y="130" text-anchor="middle" font-size="17" fill="#172b35">Decisão</text><text x="500" y="250" text-anchor="middle" font-size="16" fill="#46565e">Não remova observações apenas para melhorar métricas.</text></svg>