<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="285" viewBox="0 0 1000 285" role="img" aria-labelledby="title desc"><title id="title">Associação que varia</title><desc id="desc">Duas condições produzem inclinações distintas.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#a44a3f"/></marker></defs><rect width="100%" height="100%" fill="#fffdf8"/><text x="500" y="40" text-anchor="middle" font-size="25" font-weight="bold" fill="#172b35">Associação que varia</text><rect x="40" y="84" width="250" height="116" rx="15" fill="#f4f0e6" stroke="#294c60" stroke-width="2"/><text x="165" y="130" text-anchor="middle" font-size="17" fill="#172b35">Contexto A</text><text x="165" y="155" text-anchor="middle" font-size="17" fill="#172b35">inclinação 1</text><path d="M297 142 H366" stroke="#a44a3f" stroke-width="3" marker-end="url(#a)"/><rect x="375" y="84" width="250" height="116" rx="15" fill="#f4f0e6" stroke="#294c60" stroke-width="2"/><text x="500" y="130" text-anchor="middle" font-size="17" fill="#172b35">Interação</text><path d="M632 142 H701" stroke="#a44a3f" stroke-width="3" marker-end="url(#a)"/><rect x="710" y="84" width="250" height="116" rx="15" fill="#f4f0e6" stroke="#294c60" stroke-width="2"/><text x="835" y="130" text-anchor="middle" font-size="17" fill="#172b35">Contexto B</text><text x="835" y="155" text-anchor="middle" font-size="17" fill="#172b35">inclinação 2</text><text x="500" y="250" text-anchor="middle" font-size="16" fill="#46565e">Interprete previsões condicionais, não um coeficiente isolado.</text></svg>