<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="285" viewBox="0 0 1000 285" role="img" aria-labelledby="title desc"><title id="title">Da definição à adjudicação</title><desc id="desc">Fluxo de anotação independente e revisão do guia.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#a44a3f"/></marker></defs><rect width="100%" height="100%" fill="#fffdf8"/><text x="500" y="40" text-anchor="middle" font-size="25" font-weight="bold" fill="#172b35">Da definição à adjudicação</text><rect x="40" y="82" width="190" height="118" rx="14" fill="#f4f0e6" stroke="#294c60" stroke-width="2"/><text x="135" y="130" text-anchor="middle" font-size="17" fill="#172b35">Conceito</text><text x="135" y="154" text-anchor="middle" font-size="17" fill="#172b35">e guia</text><path d="M236 141 H275" stroke="#a44a3f" stroke-width="3" marker-end="url(#a)"/><rect x="283" y="82" width="190" height="118" rx="14" fill="#f4f0e6" stroke="#294c60" stroke-width="2"/><text x="378" y="130" text-anchor="middle" font-size="17" fill="#172b35">Anotação</text><text x="378" y="154" text-anchor="middle" font-size="17" fill="#172b35">independente</text><path d="M479 141 H519" stroke="#a44a3f" stroke-width="3" marker-end="url(#a)"/><rect x="527" y="82" width="190" height="118" rx="14" fill="#f4f0e6" stroke="#294c60" stroke-width="2"/><text x="622" y="130" text-anchor="middle" font-size="17" fill="#172b35">Desacordos</text><path d="M723 141 H762" stroke="#a44a3f" stroke-width="3" marker-end="url(#a)"/><rect x="770" y="82" width="190" height="118" rx="14" fill="#f4f0e6" stroke="#294c60" stroke-width="2"/><text x="865" y="130" text-anchor="middle" font-size="17" fill="#172b35">Adjudicação</text><text x="500" y="250" text-anchor="middle" font-size="16" fill="#46565e">Discordâncias são evidência para revisar a regra.</text></svg>