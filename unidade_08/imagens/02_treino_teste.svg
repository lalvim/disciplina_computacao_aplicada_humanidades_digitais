<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="285" viewBox="0 0 1000 285" role="img" aria-labelledby="title desc"><title id="title">O teste permanece reservado</title><desc id="desc">Dados anotados dividem-se entre treino e teste.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#a44a3f"/></marker></defs><rect width="100%" height="100%" fill="#fffdf8"/><text x="500" y="40" text-anchor="middle" font-size="25" font-weight="bold" fill="#172b35">O teste permanece reservado</text><rect x="40" y="82" width="245" height="118" rx="14" fill="#f4f0e6" stroke="#294c60" stroke-width="2"/><text x="162" y="130" text-anchor="middle" font-size="17" fill="#172b35">Dados</text><text x="162" y="154" text-anchor="middle" font-size="17" fill="#172b35">anotados</text><path d="M291 141 H370" stroke="#a44a3f" stroke-width="3" marker-end="url(#a)"/><rect x="378" y="82" width="245" height="118" rx="14" fill="#f4f0e6" stroke="#294c60" stroke-width="2"/><text x="500" y="130" text-anchor="middle" font-size="17" fill="#172b35">Treino</text><text x="500" y="154" text-anchor="middle" font-size="17" fill="#172b35">ajusta</text><path d="M628 141 H707" stroke="#a44a3f" stroke-width="3" marker-end="url(#a)"/><rect x="715" y="82" width="245" height="118" rx="14" fill="#f4f0e6" stroke="#294c60" stroke-width="2"/><text x="838" y="130" text-anchor="middle" font-size="17" fill="#172b35">Teste</text><text x="838" y="154" text-anchor="middle" font-size="17" fill="#172b35">avalia</text><text x="500" y="250" text-anchor="middle" font-size="16" fill="#46565e">Consultar repetidamente o teste contamina a avaliação.</text></svg>